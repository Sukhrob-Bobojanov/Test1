<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>TOPIK Yo'li</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;700;900&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: one phone-width column; lessons are stations on Seoul-metro lines, each stage wears its real line colour. */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface2:#E2E7EC; --ink:#11161C; --muted:#586472; --line:#D3DAE1;
  --accent:#00843D; --accent-ink:#FFFFFF; --good:#0A8A48; --good-bg:#DDF3E6; --bad:#C92F28; --bad-bg:#FBE3E1; --warn:#B56A00;
  --ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ko:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --num:"Space Grotesk","Inter",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0C0F13; --surface:#161B22; --surface2:#222A34; --ink:#EDF1F5; --muted:#93A0AE; --line:#2B3440;
  --accent:#22C06C; --accent-ink:#04140B; --good:#35CC7E; --good-bg:#12311F; --bad:#FF6E64; --bad-bg:#3A1917; --warn:#F0A63A; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0C0F13; --surface:#161B22; --surface2:#222A34; --ink:#EDF1F5; --muted:#93A0AE; --line:#2B3440;
  --accent:#22C06C; --accent-ink:#04140B; --good:#35CC7E; --good-bg:#12311F; --bad:#FF6E64; --bad-bg:#3A1917; --warn:#F0A63A; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--ui);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{cursor:not-allowed}
.ko{font-family:var(--ko);word-break:keep-all}
.wrap{max-width:680px;margin:0 auto;padding-block:16px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
h1,h2,h3,p{margin:0} h1,h2,h3{text-wrap:balance;line-height:1.2}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13.5px}

/* header */
.top{display:flex;align-items:center;gap:12px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .sign{font-family:var(--ko);font-weight:900;font-size:20px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);flex:none}
.brand b{font-family:var(--num);font-size:19px;letter-spacing:-.01em}
.sync{font-size:12px;color:var(--muted);text-align:right}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border-radius:var(--r);padding:12px 14px;min-width:0}
.stat b{display:block;font:700 26px/1.1 var(--num);font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}

/* today plan */
.plan{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.plan h2{font:700 20px/1.2 var(--num)}
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:12px;background:var(--bg);min-width:0}
.step:disabled{opacity:.5}
.step .n{font:700 14px var(--num);width:28px;height:28px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;flex:none}
.step.done .n{background:var(--good);border-color:var(--good);color:var(--surface)}
.step .tx{flex:1;min-width:0} .step .tx b{display:block} .step .tx span{font-size:13.5px;color:var(--muted)}
.step .go{font-size:13px;font-weight:600;color:var(--accent);flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:12px 20px;border-radius:12px;font-weight:600;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface2)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn:disabled{opacity:.45}
.btn.block{width:100%}

/* metro map */
.stage{display:flex;flex-direction:column;gap:4px}
.stage-h{display:flex;align-items:center;gap:12px;padding:6px 0;width:100%;min-width:0}
.stage-h .shd{flex:1;min-width:0;display:flex;flex-direction:column}
.chev{width:28px;height:28px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font:700 16px var(--num);flex:none}
.grp{font:700 13px var(--num);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:12px;border-top:1px solid var(--line)}
.tin{width:100%;font:700 26px var(--ko);padding:14px 16px;border-radius:var(--r);border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.tin:focus{outline:3px solid var(--accent);outline-offset:1px}
.badge{width:36px;height:36px;border-radius:50%;background:var(--c,var(--accent));color:#fff;font:700 18px var(--num);display:grid;place-items:center;flex:none}
.stage-h h3{font:700 18px/1.2 var(--num)} .stage-h .cnt{font:500 13px var(--num);color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.stations{list-style:none;margin:0;padding:0;position:relative}
.stations::before{content:"";position:absolute;left:15px;top:22px;bottom:22px;width:6px;border-radius:3px;background:var(--c)}
.st{position:relative;display:flex;align-items:center;gap:14px;width:100%;padding:9px 8px 9px 0;border-radius:12px;min-width:0}
.st .dot{position:relative;z-index:1;width:36px;height:36px;display:grid;place-items:center;flex:none}
.st .dot i{display:block;width:20px;height:20px;border-radius:50%;background:var(--surface);border:4px solid var(--c)}
.st.done .dot i{background:var(--c)}
.st.now .dot i{width:28px;height:28px;box-shadow:0 0 0 4px var(--bg),0 0 0 6px var(--c)}
.st.xfer .dot i{border-radius:8px;width:24px;height:24px;border-color:var(--ink)}
.st.xfer.done .dot i{background:var(--ink)}
.st.locked{opacity:.5}
.st .code{font:500 12px var(--num);color:var(--muted);font-variant-numeric:tabular-nums}
.st .nm{flex:1;min-width:0} .st .nm b{display:block;font-weight:600} .st .nm .k{font-family:var(--ko);font-size:13.5px;color:var(--muted)}
.st .tag{font-size:12px;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--surface2);flex:none;font-variant-numeric:tabular-nums}
.st.done .tag{background:var(--good-bg);color:var(--good)}
.st.now{background:var(--surface)}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.nav div{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{padding:10px 4px 9px;text-align:center;font-size:12.5px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button .g{font:700 18px/1.2 var(--ko)}
.nav button[aria-current="page"]{color:var(--accent)}
.nav .pip{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font:600 11px/18px var(--num);margin-left:4px;vertical-align:top}

/* player */
.player{max-width:680px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pbar{display:flex;align-items:center;gap:12px;padding-block:14px}
.pbar .x{width:40px;height:40px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:18px;flex:none}
.track{flex:1;height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}
.track i{display:block;height:100%;background:var(--c,var(--accent));border-radius:5px;transition:width .25s}
.pbar .ct{font:500 13px var(--num);color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.pbody{flex:1;display:flex;flex-direction:column;gap:16px;padding-block:8px 20px}
.pfoot{position:sticky;bottom:0;background:var(--bg);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px}
.pfoot .btn{flex:1}
.pfoot .btn.ghost{flex:0 0 auto}
.slide-h{font:700 26px/1.15 var(--num)}
.slide-k{font:700 34px/1.2 var(--ko)}
.tip{background:var(--surface);border-radius:var(--r);padding:14px 16px}
.tip b{display:block;margin-bottom:2px}
.words{display:grid;gap:10px}
.word{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px;width:100%;background:var(--surface);border-radius:var(--r);padding:14px 16px;min-width:0}
.word .ko{font-weight:700;font-size:30px;line-height:1.25}
.word .tr{font:500 14px var(--num);color:var(--accent)}
.word .uz{font-size:17px;font-weight:500}
.word .note{font-size:13.5px;color:var(--muted)}
.word .l{min-width:0;display:flex;flex-direction:column;gap:1px}
.spk{width:42px;height:42px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;flex:none}
.spk svg{width:20px;height:20px;fill:currentColor}
.letters{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.letter{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:2px;align-items:flex-start;width:100%;min-width:0}
.letter .ko{font-weight:900;font-size:54px;line-height:1.1}
.letter .snd{font:700 18px var(--num);color:var(--accent)}
.letter .note{font-size:13.5px;color:var(--muted)}
.pat{font:700 28px/1.25 var(--ko)}
.eq{display:inline-block;align-self:flex-start;background:var(--good-bg);color:var(--good);font-weight:600;padding:5px 12px;border-radius:99px}
.ex{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ex button{display:grid;grid-template-columns:1fr auto;gap:0 12px;align-items:center;width:100%;background:var(--surface);border-radius:12px;padding:12px 14px;min-width:0}
.ex .ko{font-size:20px;font-weight:700} .ex .tr{font:500 13px var(--num);color:var(--accent)} .ex .uz{color:var(--muted)}
.prose{display:flex;flex-direction:column;gap:10px;max-width:62ch}
.prose ul{margin:0;padding-left:20px;display:grid;gap:4px}
.blocks{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.blk{font:900 44px/1 var(--ko);background:var(--surface);border-radius:12px;padding:14px 16px}
.blk small{display:block;font:500 12px var(--num);color:var(--muted);margin-top:6px}

/* quiz */
.qlabel{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.qbig{font-weight:900;font-size:clamp(40px,13vw,64px);line-height:1.2;text-align:center;padding:14px 0}
.qprompt{font-size:22px;font-weight:600;line-height:1.35}
.qprompt.ko{font-size:24px}
.qsub{color:var(--muted)}
.passage{background:var(--surface);border-radius:var(--r);padding:14px 16px;font-size:19px;line-height:1.7;white-space:pre-line}
.blank{display:inline-block;min-width:54px;border-bottom:3px solid var(--accent);text-align:center;color:var(--accent);font-weight:700}
.listen{align-self:center;width:96px;height:96px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.listen svg{width:40px;height:40px;fill:currentColor}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:10px 14px;font-size:17px;font-weight:500;min-width:0;overflow-wrap:anywhere}
.opt kbd{font:500 12px var(--num);color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;flex:none}
.opts.kopts .opt{font-family:var(--ko);font-size:22px;font-weight:700}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.fb{border-radius:var(--r);padding:12px 16px;font-weight:600}
.fb.ok{background:var(--good-bg);color:var(--good)} .fb.no{background:var(--bad-bg);color:var(--bad)}
.fb span{display:block;font-weight:400;color:var(--ink);margin-top:2px}
.line-a{min-height:64px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;align-content:flex-start}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{font:700 20px var(--ko);background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:8px 12px}
.tile.used{visibility:hidden}

/* result */
.res{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;padding-top:24px}
.ring{font:700 56px/1 var(--num);font-variant-numeric:tabular-nums}
.ring.pass{color:var(--good)} .ring.fail{color:var(--bad)}
.miss{list-style:none;padding:0;margin:0;display:grid;gap:8px;text-align:left;width:100%}
.miss li{background:var(--surface);border-radius:12px;padding:12px 14px}

/* flashcard + boost */
.card{background:var(--surface);border-radius:20px;padding:28px 18px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;min-height:240px;justify-content:center}
.card .ko{font-weight:900;font-size:clamp(36px,12vw,56px);line-height:1.2}
.card .uz{font-size:22px;font-weight:600}
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.hud div{background:var(--surface);border-radius:12px;padding:8px}
.hud b{display:block;font:700 24px var(--num);font-variant-numeric:tabular-nums}
.hud span{font-size:12px;color:var(--muted)}
.hero-k{font:900 44px/1.1 var(--ko)}

/* topik page */
.panel{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.panel h2{font:700 19px/1.2 var(--num)}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14.5px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.road{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.road li{display:flex;gap:12px;align-items:flex-start}
.road .badge{width:30px;height:30px;font-size:15px}
.road b{display:block}
.chip{display:inline-block;font-size:12px;font-weight:600;border-radius:99px;padding:2px 9px;background:var(--surface2);margin-left:6px;vertical-align:middle}
.chip.on{background:var(--good-bg);color:var(--good)}
.meter{height:12px;border-radius:6px;background:var(--surface2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch{width:52px;height:30px;border-radius:15px;background:var(--surface2);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);box-shadow:0 0 0 1px var(--line);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(22px)}
@media (max-width:420px){.opts.two{grid-template-columns:1fr}.stat b{font-size:22px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

mark.gw{background:var(--good-bg);color:inherit;border-radius:5px;padding:1px 3px;cursor:pointer;border-bottom:2px solid var(--good)}
.glbox{background:var(--surface);border-radius:12px;padding:12px 14px;min-height:48px}
.glbox .ko{font-size:19px}.glbox .tr{font:500 13px var(--num);color:var(--accent)}
.btn svg{width:20px;height:20px;fill:currentColor;flex:none}

</style>
<div id="main" class="wrap"></div>
<div id="player" class="player" hidden></div>
<nav class="nav" id="nav" aria-label="Bo'limlar"><div>
  <button data-act="tab" data-tab="home"><span class="g">길</span>Yo'l</button>
  <button data-act="tab" data-tab="review"><span class="g">복습</span><span>Takrorlash<span class="pip" id="pip" hidden></span></span></button>
  <button data-act="tab" data-tab="boost"><span class="g">빨리</span>Boost</button>
  <button data-act="tab" data-tab="topik"><span class="g">시험</span>TOPIK</button>
</div></nav>
<script>
(() => {
// Kurs ma'lumotlari. Har bir bosqich — Seul metrosining bitta liniyasi.
// lesson: v=[koreyscha, o'zbekcha, izoh?]  g=[{p,uz,d,ex}]  c=[gap, javob, [chalg'ituvchilar], tarjima]
// test:   qs=[{q, text?, audio?, opts, a, exp}]
const STAGES = [];

STAGES.push({
  grp: "Alifbo", id: "h", line: 5, color: "#996CAC", name: "Hangul — alifbo", ko: "한글",
  lessons: [
    {
      id: "h1", type: "hangul", t: "Asosiy unlilar", k: "모음 1",
      goal: "6 ta asosiy unlini o'qish va bo'g'in qanday tuzilishini tushunish.",
      tip: "Koreyada har kuni ko'rgan belgilaringiz endi tovushga aylanadi. Hangul — 24 ta harf, bir haftada o'rganiladi.",
      intro: "<p>Har bir koreyscha bo'g'in bitta <b>katak</b> ichiga yoziladi: <b>undosh + unli</b> (ba'zan ostida yana bir undosh).</p><p>Unli yolg'iz o'qilsa, oldiga tovushsiz <b class='ko'>ㅇ</b> qo'yiladi: <b class='ko'>ㅏ</b> → <b class='ko'>아</b>.</p><p>Tik unlilar (ㅏ ㅓ ㅣ) undoshning <b>o'ng</b> tomoniga, yotiq unlilar (ㅗ ㅜ ㅡ) <b>ostiga</b> yoziladi.</p>",
      letters: [
        ["아", "a", "Chiziqcha o'ngga qaragan"],
        ["어", "o", "«ota»dagi ochiq o. Chiziqcha chapga"],
        ["오", "o'", "«o'n»dagi o'. Chiziqcha tepaga"],
        ["우", "u", "Chiziqcha pastga"],
        ["으", "ɨ", "Ruscha «ы» kabi, lab cho'zilmaydi"],
        ["이", "i", "Tik chiziq"]
      ],
      words: [["아이", "bola"], ["오이", "bodring"], ["이", "ikki (2)"], ["오", "besh (5)"]]
    },
    {
      id: "h2", type: "hangul", t: "Asosiy undoshlar", k: "자음 1",
      goal: "9 ta asosiy undoshni o'qish va birinchi haqiqiy so'zlarni o'qish.",
      tip: "ㄱ ㄷ ㅂ ㅈ so'z boshida k, t, p, ch ga yaqinroq, so'z o'rtasida g, d, b, j bo'lib eshitiladi. Shuning uchun 부산 ham «Busan», ham «Pusan» deb yoziladi.",
      letters: [
        ["가", "ga", "ㄱ — g/k. Burchak, «g»"],
        ["나", "na", "ㄴ — n. Lotincha L ga o'xshaydi, lekin «n»"],
        ["다", "da", "ㄷ — d/t. Ochiq eshik — «d»"],
        ["라", "ra", "ㄹ — r/l. Ilon izi"],
        ["마", "ma", "ㅁ — m. Kvadrat — yopiq og'iz"],
        ["바", "ba", "ㅂ — b/p. Chelak"],
        ["사", "sa", "ㅅ — s. Ikki oyoq"],
        ["자", "ja", "ㅈ — j. ㅅ ustida tom"],
        ["하", "ha", "ㅎ — h. Shlyapali odam"]
      ],
      words: [["나", "men"], ["나라", "davlat"], ["어머니", "ona"], ["아버지", "ota"], ["바나나", "banan"], ["버스", "avtobus"], ["가수", "xonanda"], ["모자", "shlyapa"], ["다리", "oyoq; ko'prik"], ["하나", "bitta"], ["누나", "opa (o'g'il bola uchun)"], ["지하", "yer osti"]]
    },
    {
      id: "h3", type: "hangul", t: "Y-unlilar va E", k: "모음 2",
      goal: "ㅑ ㅕ ㅛ ㅠ va ㅐ ㅔ unlilarini o'qish.",
      tip: "Qoida oddiy: unliga ikkinchi chiziqcha qo'shilsa, oldiga «y» tovushi qo'shiladi: ㅏ a → ㅑ ya.",
      letters: [

        { q: "읽기 21-tur. Bo'sh joyga mos maqol.", text: "사고가 난 뒤에야 안전 규정을 만드는 것은 (   ) 식의 대응이다.", opts: ["소 잃고 외양간 고치는", "티끌 모아 태산이 되는", "백지장도 맞드는", "우물 안 개구리 같은"], a: 0, exp: "Ish o'tgandan keyin chora ko'rish — «sigir yo'qolgach og'il tuzatish»." },
        { q: "듣기 32-tur. Erkakning munosabati.", audio: "그 주장에도 일리가 있다고 봅니다. 다만 한 가지 조사 결과만으로 결론을 내리는 것은 성급합니다. 지역과 세대를 비롯하여 다양한 요인을 함께 살펴본 후에 판단해야 한다고 생각합니다.", opts: ["상대의 의견을 일부 인정하면서 신중한 판단을 요구하고 있다.", "상대의 주장에 전적으로 동의하고 있다.", "조사 결과를 근거로 상대를 강하게 비판하고 있다.", "문제의 책임을 다른 사람에게 돌리고 있다."], a: 0, exp: "«Asosi bor… ammo shoshilinch» — qisman tan olib, ehtiyotkorlikni talab qilyapti." },
        { q: "읽기 28-tur. Bo'sh joyga mos qism.", text: "기술이 발달할수록 인간의 노동이 줄어들 것이라는 예상과 달리 현대인은 오히려 더 바빠졌다. 일을 빨리 처리할 수 있게 되자 (   ) 때문이다. 결국 기술은 시간을 만들어 주기는커녕 우리에게서 여유를 빼앗아 간 셈이다.", opts: ["같은 시간에 더 많은 일을 요구받게 되었기", "일하는 시간이 크게 줄어들었기", "사람들이 기술을 사용하지 않게 되었기", "여가 활동이 다양해졌기"], a: 0, exp: "Tezroq ishlash mumkin bo'lgach, ko'proq ish talab qilina boshladi." },
        { q: "읽기 41-tur. Gap qayerga tushadi?  «그러나 이는 사실의 일면에 불과하다.»", text: "도시의 밤이 밝아진 것은 흔히 안전과 편리함의 상징으로 여겨진다. ( ㄱ ) 지나친 인공 조명은 사람의 수면을 방해할뿐더러 동식물의 생태에도 혼란을 초래한다. ( ㄴ ) 이에 따라 일부 도시에서는 밤 시간대 조명을 제한하는 제도를 시행하고 있다. ( ㄷ ) 빛도 관리해야 할 환경 요소라는 인식이 확산되고 있는 것이다. ( ㄹ )", opts: ["ㄱ", "ㄴ", "ㄷ", "ㄹ"], a: 0, exp: "Ijobiy qarash → «ammo bu faqat bir tomoni» → salbiy oqibatlar." },
        { q: "읽기 48-tur. Muallifning maqsadi.", text: "기본 소득 제도에 대한 논의가 다시 대두되고 있다. 재정 부담을 우려하는 목소리가 있는가 하면 양극화 해소의 대안으로 기대하는 시각도 있다. 그러나 찬반을 따지기에 앞서 소규모 시범 사업을 통해 효과를 객관적으로 검증하는 과정이 선행되어야 할 것이다.", opts: ["제도 도입에 앞서 검증이 필요함을 주장하려고", "기본 소득 제도의 즉각적인 도입을 촉구하려고", "기본 소득 제도의 문제점을 비판하려고", "재정 부담을 줄이는 방법을 소개하려고"], a: 0, exp: "«Tarafdor-qarshi bahsidan oldin sinov orqali tekshirish kerak»." }

        { q: "읽기 37-tur. Matnning mavzusi.", text: "다양성은 조직에 갈등을 가져온다는 편견이 있다. 실제로 배경이 다른 구성원들은 합의에 이르는 데 시간이 더 걸린다. 그러나 그 과정에서 미처 간과했던 위험이 드러나고 새로운 대안이 모색된다. 비슷한 사람들끼리 빠르게 내린 결정보다 결과가 나은 경우가 많은 것은 그 때문이다.", opts: ["구성원의 다양성은 더 나은 결정을 이끌어 낸다.", "다양한 구성원이 모이면 갈등만 커진다.", "빠른 합의가 조직의 성과를 높인다.", "배경이 비슷한 사람들이 일을 더 잘한다."], a: 0, exp: "Xilma-xillik sekinlashtiradi, lekin natija yaxshiroq." },
        { q: "읽기 42-tur. Tagiga chizilgan qismdagi «men»ning his-tuyg'usi.", text: "아버지는 평생 고향을 떠난 적이 없었다. 서울로 올라가겠다는 내 말에 아버지는 아무 대답 없이 마당만 쓸었다. 떠나는 날 아침, 가방 속에서 낡은 봉투 하나가 나왔다. 꼬깃꼬깃한 지폐 몇 장과 함께 '밥은 굶지 마라'는 서툰 글씨가 적혀 있었다. 나는 차마 고개를 들 수 없었다.", opts: ["죄송하고 가슴이 뭉클하다", "화가 나고 억울하다", "지루하고 답답하다", "자랑스럽고 뿌듯하다"], a: 0, exp: "Otaning jimgina g'amxo'rligi oldida boshini ko'tara olmadi — uyat va ta'sirlanish." },
        { q: "읽기 46-tur. Muallifning munosabati.", text: "인공지능이 쓴 글이 사람의 글과 구별되지 않는 시대가 되었다. 이를 두고 창작의 종말을 말하는 것은 성급하다. 사진이 등장했을 때 회화가 사라질 것이라던 우려와 달리 화가들은 오히려 새로운 표현을 모색했다. 중요한 것은 도구가 아니라 그것으로 무엇을 말하려는가이다.", opts: ["기술의 변화를 지나치게 비관할 필요가 없다고 본다.", "인공지능이 창작을 끝낼 것이라고 우려한다.", "인공지능의 글쓰기를 금지해야 한다고 주장한다.", "사진이 회화보다 뛰어나다고 평가한다."], a: 0, exp: "«Oxirat deyish shoshilinch» — ortiqcha vahima kerak emas." },
        { q: "쓰기 54. Inshoda dalilni kuchaytiradigan eng mos gap.", text: "Mavzu: «경쟁은 사회 발전에 도움이 되는가»", opts: ["경쟁은 개인의 잠재력을 끌어낼뿐더러 사회 전체의 효율을 촉진한다는 점에서 긍정적이다.", "경쟁은 진짜 너무 좋은 것 같아요.", "저는 경쟁을 좋아합니다.", "경쟁이 뭐가 나쁜지 모르겠다."], a: 0, exp: "Kitobiy uslub, yuqori daraja bog'lovchi (-(으)ㄹ뿐더러) va aniq asos." }

  ["t5", "Platforma mehnati", "플랫폼 노동", "배달 앱이나 대리운전 앱을 통해 일감을 얻는 플랫폼 노동자가 급증하고 있다. 이들은 원하는 시간에 일할 수 있다는 장점을 누리지만 법적으로는 근로자가 아닌 개인 사업자로 분류된다. 그 탓에 다치더라도 산재 보상을 받기 어렵고 일감이 끊기면 수입이 곧바로 사라진다. 업체는 이들을 지휘하고 평가하면서도 고용주로서의 책임은 회피한다는 지적을 받는다. 일하는 방식이 달라진 만큼 보호의 울타리도 새로 설계해야 한다.",

    ["변화한 노동 방식에 맞는 새로운 보호 제도가 필요하다.", "플랫폼 노동자는 법적으로 충분히 보호받고 있다.", "플랫폼 노동자의 수는 줄어들고 있다.", "업체는 고용주로서 모든 책임을 지고 있다."],

  ["t6", "Chegirma hiylasi", "할인의 심리", "할인 전 가격을 굵게 적어 놓고 줄을 그은 뒤 그 옆에 할인가를 표시하는 것은 흔한 판매 기법이다. 소비자는 처음 본 숫자를 기준점으로 삼아 뒤에 제시된 가격이 싼지 비싼지를 가늠하기 때문이다. 원래 가격이 부풀려져 있더라도 사람들은 이득을 봤다는 착각에 빠지기 쉽다. 이러한 심리를 악용한 눈속임 할인이 기승을 부리자 당국은 일정 기간 실제로 판매한 가격만 종전 가격으로 표기하도록 규제에 나섰다. 현명한 소비를 하려면 할인율이 아니라 최종 지불 금액을 따져 보아야 한다.",
    "굵게:굵다=yo'g'on, qalin|표시하는:표시하다=belgilamoq|기법=usul, texnika|기준점=tayanch nuqta|삼아:삼다=… qilib olmoq|가늠하기:가늠하다=chamalamoq|부풀려져:부풀리다=shishirmoq, oshirib ko'rsatmoq|이득=foyda, naf|착각=yanglish tasavvur|악용한:악용하다=suiiste'mol qilmoq|눈속임=ko'zbo'yamachilik|기승을 부리자:기승을 부리다=avj olmoq|당국=mas'ul idora|종전=avvalgi|표기하도록:표기하다=yozib ko'rsatmoq|나섰다:나서다=kirishmoq, oldinga chiqmoq|현명한:현명하다=oqil, dono|할인율=chegirma foizi|최종=yakuniy|지불=to'lov|금액=summa",
    ["할인율보다 실제로 내는 금액을 보고 판단해야 한다.", "할인 상품은 항상 이득이다.", "소비자는 처음 본 가격의 영향을 받지 않는다.", "당국은 모든 할인 판매를 금지했다."],
    ["부풀린 원래 가격 때문에 소비자가 이득을 봤다고 착각할 수 있다.", "눈속임 할인은 거의 사라졌다.", "당국은 종전 가격 표기를 자유롭게 허용했다.", "소비자는 나중에 본 숫자를 기준으로 삼는다."]],
  ["t7", "Mahalla va ijara narxi", "골목 상권", "낙후된 골목에 개성 있는 가게들이 들어서면 동네에 활기가 돌고 방문객이 몰려든다. 그런데 유명세를 타는 순간 임대료가 치솟아 정작 동네를 일군 상인들이 쫓겨나는 일이 벌어진다. 그 자리를 대형 프랜차이즈가 차지하면 골목은 고유의 색깔을 잃고 손님의 발길도 뜸해진다. 이를 막고자 일부 지자체는 건물주와 임차인이 임대료 인상을 자제하기로 약속하는 협약을 주선하고 있다. 동네의 가치를 함께 만든 이들이 그 결실도 함께 누려야 한다는 취지이다.",
    "개성=o'ziga xoslik|들어서면:들어서다=joylashmoq, kirib kelmoq|동네=mahalla|활기=jonlanish|방문객=tashrif buyuruvchi|몰려든다:몰려들다=yopirilib kelmoq|유명세=mashhurlik (va uning badali)|임대료=ijara haqi|치솟아:치솟다=keskin ko'tarilmoq|일군:일구다=barpo etmoq|상인=savdogar|쫓겨나는:쫓겨나다=haydalmoq|대형=yirik|고유=o'ziga xos, asl|발길=qadam, kelib-ketish|뜸해진다:뜸하다=siyraklashmoq|지자체=mahalliy hokimiyat|건물주=bino egasi|임차인=ijarachi|자제하기로:자제하다=o'zini tiymoq|협약=kelishuv bitimi|주선하고:주선하다=vositachilik qilib uyushtirmoq|결실=samara, hosil",
    ["동네를 살린 상인들도 그 성과를 함께 누릴 수 있어야 한다.", "임대료는 시장에 맡겨야 한다.", "대형 프랜차이즈가 들어와야 골목이 발전한다.", "낙후된 골목은 개발할 필요가 없다."],
    ["동네가 유명해지면 임대료가 올라 기존 상인이 떠나게 된다.", "프랜차이즈가 들어오면 손님이 더 늘어난다.", "지자체는 임대료 인상을 법으로 금지했다.", "건물주와 임차인은 협약을 거부하고 있다."]],
  ["t8", "Tasdiqlashga moyillik", "확증 편향", "사람은 자신의 신념에 부합하는 정보는 쉽게 받아들이고 그에 어긋나는 정보는 외면하는 경향이 있다. 이른바 확증 편향이다. 추천 알고리즘은 이용자가 선호할 만한 콘텐츠만 골라 보여 주므로 이러한 편향을 한층 부채질한다. 그 결과 비슷한 견해를 가진 사람들끼리만 소통하며 생각이 극단으로 치닫는 현상이 나타난다. 허위 정보가 걷잡을 수 없이 유포되는 것도 이 때문이다. 의식적으로 반대편의 주장을 찾아 읽는 습관이 균형 잡힌 판단의 출발점이 된다.",
    "부합하는:부합하다=mos kelmoq|받아들이고:받아들이다=qabul qilmoq|어긋나는:어긋나다=zid kelmoq|외면하는:외면하다=yuz o'girmoq, e'tiborsiz qoldirmoq|확증 편향=tasdiqlashga moyillik xatosi|이용자=foydalanuvchi|선호할:선호하다=afzal ko'rmoq|콘텐츠=kontent|부채질한다:부채질하다=yelpimoq; kuchaytirmoq|끼리=o'zaro (bir xillar)|소통하며:소통하다=muloqot qilmoq|극단=o'ta chekka|치닫는:치닫다=shiddat bilan intilmoq|허위=yolg'on, soxta|걷잡을 수 없이=to'xtatib bo'lmas darajada|유포되는:유포되다=tarqalmoq|의식적=ongli|반대편=qarshi tomon|균형 잡힌:균형 잡히다=muvozanatli bo'lmoq|출발점=boshlang'ich nuqta",
    ["자신과 다른 의견도 일부러 찾아 읽어야 균형 있게 판단할 수 있다.", "추천 알고리즘은 다양한 의견을 보여 준다.", "사람은 모든 정보를 공평하게 받아들인다.", "허위 정보는 쉽게 사라진다."],
    ["알고리즘은 이용자가 좋아할 만한 내용만 보여 주어 편향을 강화한다.", "비슷한 생각을 가진 사람끼리 소통하면 생각이 온건해진다.", "확증 편향은 신념과 다른 정보를 더 잘 받아들이는 것이다.", "허위 정보의 유포는 알고리즘과 관계가 없다."]],
  ["t9", "Daromad va ta'lim", "교육과 계층", "부모의 경제력이 자녀의 학업 성취를 좌우하는 경향이 갈수록 뚜렷해지고 있다. 고소득 가정은 일찍부터 사교육에 막대한 비용을 쏟아붓고, 그 결과가 명문대 진학률의 격차로 고스란히 나타난다. 교육이 계층 이동의 사다리가 아니라 지위를 대물림하는 통로가 되고 있다는 우려가 나오는 까닭이다. 출발선이 다른 경쟁을 공정하다고 부르기는 어렵다. 저소득층 학생에 대한 지원을 확충하고 공교육의 질을 끌어올리는 일이 시급하다.",
    "경제력=iqtisodiy imkoniyat|자녀=farzand|학업=o'qish, tahsil|좌우하는:좌우하다=hal qiluvchi ta'sir ko'rsatmoq|갈수록=borgan sari|고소득=yuqori daromad|가정=oila, xonadon|쏟아붓고:쏟아붓다=to'kib solmoq, ayamay sarflamoq|명문대=nufuzli universitet|진학률=o'qishga kirish ko'rsatkichi|이동=ko'chish, harakatlanish|대물림하는:대물림하다=avloddan avlodga o'tkazmoq|통로=yo'lak, kanal|출발선=start chizig'i|저소득층=kam daromadli qatlam|확충하고:확충하다=kengaytirib to'ldirmoq|질=sifat|끌어올리는:끌어올리다=yuqoriga ko'tarmoq",
    ["공정한 경쟁을 위해 저소득층 지원과 공교육 강화가 필요하다.", "사교육을 더 늘려야 한다.", "부모의 경제력은 학업과 관계가 없다.", "교육은 지금도 계층 이동의 사다리 역할을 잘하고 있다."],
    ["고소득 가정의 사교육 투자가 명문대 진학률 차이로 이어진다.", "저소득층 학생의 진학률이 더 높다.", "공교육의 질은 이미 충분히 높다.", "부모의 경제력과 성적의 관계는 약해지고 있다."]],
  ["t10", "Yolg'iz yashovchilar bozori", "1인 가구 시장", "혼자 사는 가구가 전체의 3분의 1을 넘어서면서 시장의 풍경이 바뀌고 있다. 소포장 식품과 소형 가전이 불티나게 팔리고 혼자 온 손님을 겨냥한 식당이 속속 생겨난다. 기업들은 다인 가구를 전제로 짜 놓았던 상품 구성을 전면 재검토하고 있다. 다만 1인 가구의 상당수가 고령층이거나 저소득층이라는 사실은 간과되기 쉽다. 화려한 소비 유행의 이면에 자리한 고립과 빈곤 문제에도 눈길을 돌려야 한다.",
    "풍경=manzara|소포장=kichik qadoq|식품=oziq-ovqat mahsuloti|소형=kichik hajmli|가전=maishiy texnika|불티나게=qo'lma-qo'l bo'lib (sotilmoq)|겨냥한:겨냥하다=nishonga olmoq|속속=ketma-ket|생겨난다:생겨나다=paydo bo'lmoq|다인=ko'p kishilik|구성=tarkib, tuzilish|전면=to'liq, yalpi|재검토하고:재검토하다=qayta ko'rib chiqmoq|상당수=anchagina qismi|고령층=keksa yoshdagilar|이면=orqa tomoni, yashirin jihat|자리한:자리하다=joylashmoq|눈길=nigoh, e'tibor",
    ["1인 가구 소비 유행 뒤에 있는 고립과 빈곤 문제도 살펴야 한다.", "1인 가구는 모두 경제적으로 여유롭다.", "기업들은 1인 가구에 관심이 없다.", "1인 가구의 수는 줄어들고 있다."],
    ["기업들이 여러 명이 사는 가구에 맞춘 상품 구성을 다시 살펴보고 있다.", "소형 가전은 잘 팔리지 않는다.", "1인 가구의 대부분은 젊은 고소득층이다.", "혼자 온 손님을 받는 식당은 줄고 있다."]],
  ["t11", "Adolatli savdo", "공정 무역", "우리가 마시는 커피 한 잔 값에서 원두를 재배한 농민에게 돌아가는 몫은 극히 일부에 불과하다. 공정 무역은 생산자에게 정당한 대가를 지불하고 아동 노동을 금지하는 조건으로 거래하자는 운동이다. 소비자는 웃돈을 조금 더 얹어 주는 대신 윤리적 소비를 실천했다는 보람을 얻는다. 하지만 인증 절차에 드는 비용이 버거워 정작 가장 가난한 농가는 참여하지 못한다는 맹점도 있다. 선의에 기대는 것만으로는 불균형한 교역 구조를 바로잡기에 역부족이다.",
    "원두=qahva doni|재배한:재배하다=yetishtirmoq|농민=dehqonlar|몫=ulush|극히=o'ta, nihoyatda|생산자=ishlab chiqaruvchi|아동=bola (rasmiy)|거래하자는:거래하다=savdo qilmoq|웃돈=ustama pul|얹어:얹다=ustiga qo'ymoq|실천했다는:실천하다=amalda bajarmoq|버거워:버겁다=og'irlik qilmoq|농가=dehqon xo'jaligi|맹점=ko'r nuqta, zaif joy|선의=yaxshi niyat|기대는:기대다=suyanmoq|불균형한:불균형하다=nomutanosib|교역=xalqaro savdo-sotiq|바로잡기에:바로잡다=to'g'rilamoq|역부족=kuch yetmasligi",

  ["s5", "Iqlim va ekinlar", "기후와 농업", "기온이 오르면서 작물의 재배 한계선이 북쪽으로 올라가고 있다. 남부 지방의 특산물이던 사과는 이제 강원도 산간에서도 수확된다. 얼핏 재배 가능 지역이 넓어지는 호재처럼 보이지만 실상은 그렇지 않다. 예측하기 힘든 폭우와 가뭄이 번갈아 닥치면서 수확량이 들쭉날쭉해지고 낯선 병해충까지 창궐하기 때문이다. 품종을 개량하고 물 관리 시설을 정비하는 등 기후 적응을 위한 투자를 서두르지 않으면 식량 수급에 차질이 생길 수 있다.",

    ["기후 변화에 적응하기 위한 농업 투자를 서둘러야 한다.", "기온 상승은 농업에 좋은 소식일 뿐이다.", "사과는 더 이상 재배할 수 없게 되었다.", "병해충은 줄어들고 있다."],
    ["폭우와 가뭄 때문에 수확량이 일정하지 않다.", "재배 한계선이 남쪽으로 내려가고 있다.", "강원도에서는 사과를 재배할 수 없다.", "식량 수급에는 아무 문제가 없을 것이다."]],
  ["s6", "Unutishning foydasi", "망각의 쓸모", "망각은 흔히 기억의 실패로 치부되지만 뇌가 제 기능을 다하기 위한 필수 과정이다. 겪은 일을 하나도 빠짐없이 저장한다면 정작 중요한 정보를 신속히 인출하기 어려워진다. 뇌는 쓸모없는 세부를 솎아 내고 여러 경험에 공통된 뼈대만 남김으로써 새로운 상황에 응용할 수 있는 지식을 만든다. 반복해서 떠올리는 기억은 강화되고 방치된 기억은 서서히 희미해지는 것도 이 때문이다. 잊는다는 것은 결함이 아니라 효율을 위한 전략인 셈이다.",
    "망각=unutish|치부되지만:치부되다=deb hisoblanmoq (salbiy)|빠짐없이=birortasini qoldirmay|신속히=tezkorlik bilan|인출하기:인출하다=chiqarib olmoq|쓸모없는:쓸모없다=foydasiz|솎아 내고:솎아 내다=saralab olib tashlamoq|공통된:공통되다=umumiy bo'lmoq|뼈대=sinch, asosiy tuzilma|응용할:응용하다=tatbiq etmoq|강화되고:강화되다=kuchaymoq, mustahkamlanmoq|방치된:방치되다=qarovsiz qolmoq|서서히=asta-sekin|결함=nuqson",
    ["잊는 것은 뇌가 효율적으로 일하기 위한 방법이다.", "기억을 모두 저장할수록 판단이 빨라진다.", "망각은 뇌의 고장을 뜻한다.", "반복해서 떠올린 기억은 약해진다."],
    ["뇌는 불필요한 세부를 지우고 공통된 핵심만 남긴다.", "방치된 기억은 점점 뚜렷해진다.", "모든 기억을 저장해야 중요한 정보를 빨리 찾을 수 있다.", "망각은 새로운 상황에 지식을 쓰는 것을 방해한다."]],
  ["s7", "Antibiotikka chidamlilik", "항생제 내성", "항생제는 세균 감염으로부터 수많은 목숨을 구해 왔다. 그러나 무분별하게 처방되고 가축 사료에까지 첨가되면서 약이 듣지 않는 내성균이 출현했다. 살아남은 세균이 내성 유전자를 후대에 물려줄 뿐 아니라 다른 종의 세균에게도 건네주기 때문에 확산 속도가 빠르다. 신약 개발은 수익성이 낮다는 이유로 제약사들이 꺼리는 실정이다. 이 추세가 이어지면 가벼운 상처로도 목숨을 잃던 시절로 회귀할 수 있다는 경고는 결코 과장이 아니다.",

    ["항생제 내성 문제가 계속되면 큰 위험이 닥칠 수 있다.", "항생제는 많이 쓸수록 효과가 좋아진다.", "제약사들은 신약 개발에 적극적이다.", "내성균은 다른 세균에게 영향을 주지 않는다."],
    ["가축 사료에도 항생제가 들어가면서 내성균이 생겼다.", "내성 유전자는 같은 종 안에서만 전달된다.", "신약 개발은 수익성이 매우 높다.", "항생제는 지금까지 큰 도움이 되지 못했다."]],
  ["s8", "Koinot chiqindisi", "우주 쓰레기", "지구 궤도에는 수명을 다한 위성과 로켓의 잔해가 총알보다 빠른 속도로 떠돌고 있다. 파편끼리 충돌하면 더 많은 파편이 생겨나고, 이것이 다시 충돌을 일으키는 연쇄 반응이 우려된다. 궤도가 파편으로 뒤덮이면 통신과 기상 관측은 물론 위치 정보 서비스까지 마비될 수 있다. 그물이나 로봇 팔로 잔해를 포획하는 기술이 시험되고 있으나 비용이 천문학적이다. 발사 단계에서부터 폐기 계획을 의무적으로 제출하게 하는 국제 규범의 정립이 급선무이다.",
    "궤도=orbita|위성=sun'iy yo'ldosh|로켓=raketa|잔해=qoldiq, vayrona|총알=o'q|떠돌고:떠돌다=sarson kezmoq|파편=parcha, bo'lak|충돌하면:충돌하다=to'qnashmoq|연쇄=zanjirli|뒤덮이면:뒤덮이다=qoplanmoq|통신=aloqa|기상=ob-havo, meteorologiya|관측=ilmiy kuzatuv|위치=joylashuv|그물=to'r|포획하는:포획하다=tutib olmoq|천문학적=astronomik, juda katta|발사=uchirish|폐기=yo'q qilish, chiqitga chiqarish|의무적=majburiy|정립=barqaror o'rnatish|급선무=eng dolzarb vazifa",
    ["우주 쓰레기를 줄이기 위한 국제 규범을 서둘러 만들어야 한다.", "우주 쓰레기는 저절로 사라진다.", "잔해를 수거하는 기술은 값이 싸다.", "우주 쓰레기는 지상의 생활과 관계가 없다."],
    ["파편이 서로 부딪치면 파편의 수가 더 늘어난다.", "궤도의 잔해는 매우 느리게 움직인다.", "잔해 포획 기술은 이미 널리 쓰이고 있다.", "궤도가 파편으로 덮여도 통신에는 문제가 없다."]],
  ["s9", "Gen qaychisi", "유전자 가위", "유전자 가위 기술은 유전 정보의 특정 부위를 정밀하게 잘라 내고 교정할 수 있게 해 준다. 난치병을 근원적으로 치료할 길이 열렸다는 기대가 큰 한편, 배아 단계에서 형질을 선별하거나 강화하는 데 쓰일 수 있다는 우려도 제기된다. 한 번 손댄 유전자는 후손에게 전해지므로 예기치 못한 부작용이 대대로 이어질 위험이 있다. 부유층만이 우월한 형질을 구매하는 사회가 도래할지 모른다는 경고도 흘려듣기 어렵다. 치료와 개량 사이의 경계선을 어디에 그을지 숙의가 필요하다.",
    "부위=qism, joy (tanada)|정밀하게:정밀하다=aniq, nozik|잘라 내고:잘라 내다=kesib olmoq|교정할:교정하다=tuzatmoq|난치병=davolash qiyin kasallik|근원적=tubdan|배아=embrion|형질=irsiy belgi|선별하거나:선별하다=saralamoq|제기된다:제기되다=ko'tarilmoq (masala)|손댄:손대다=qo'l tekkizmoq|전해지므로:전해지다=yetkazilmoq, o'tmoq|예기치 못한=kutilmagan|대대로=avloddan avlodga|부유층=boy qatlam|우월한:우월하다=ustun|구매하는:구매하다=xarid qilmoq|도래할지:도래하다=yetib kelmoq (davr)|흘려듣기:흘려듣다=quloq tashlamay o'tkazmoq|경계선=chegara chizig'i|숙의=chuqur muhokama",
    ["유전자 가위를 어디까지 허용할지 깊이 논의해야 한다.", "유전자 가위는 위험이 전혀 없는 기술이다.", "유전자 가위는 치료에 쓸 수 없다.", "유전자를 바꿔도 후손에게는 전해지지 않는다."],

  ["s10", "Ma'lumot markazlari va energiya", "데이터 센터와 전력", "우리가 무심코 주고받는 사진과 영상은 거대한 데이터 센터에 보관된다. 수만 대의 서버가 내뿜는 열을 식히는 데에는 막대한 전력과 냉각수가 소모된다. 인공지능 서비스가 보급되면서 전력 수요는 가파르게 치솟고 있다. 일부 기업은 서버를 바닷속에 가라앉히거나 한랭 지역으로 옮겨 냉각 비용을 절감하려 한다. 그러나 근본적으로는 재생 에너지로 전력을 충당하고 연산 효율을 높이는 설계가 뒷받침되어야 디지털 경제의 지속 가능성을 담보할 수 있다.",
    "무심코=bexosdan, o'ylamay|주고받는:주고받다=berib-olmoq, almashmoq|거대한:거대하다=ulkan|보관된다:보관되다=saqlanmoq|서버=server|내뿜는:내뿜다=purkab chiqarmoq|전력=elektr quvvati|냉각수=sovutish suvi|소모된다:소모되다=sarflanmoq|보급되면서:보급되다=keng joriy bo'lmoq|가파르게:가파르다=tik, keskin|바닷속=dengiz tubi|가라앉히거나:가라앉히다=cho'ktirmoq|한랭=sovuq (iqlim)|냉각=sovutish|절감하려:절감하다=tejab kamaytirmoq|근본적=tub, asosiy|충당하고:충당하다=ehtiyojni qoplamoq|연산=hisoblash amali|담보할:담보하다=kafolatlamoq",
    ["재생 에너지와 효율적인 설계가 있어야 디지털 경제가 지속될 수 있다.", "데이터 센터는 전력을 거의 쓰지 않는다.", "서버를 바다에 넣으면 문제가 모두 해결된다.", "인공지능은 전력 수요를 줄인다."],
    ["인공지능 서비스가 퍼지면서 전력 수요가 빠르게 늘고 있다.", "서버의 열을 식히는 데에는 물이 필요 없다.", "사진과 영상은 데이터 센터에 저장되지 않는다.", "기업들은 냉각 비용에 관심이 없다."]],
  ["s11", "Vaksina va jamoa immuniteti", "백신과 집단 면역", "백신은 병원체의 일부나 약화된 형태를 미리 주입해 면역 체계가 대비하도록 훈련시킨다. 접종률이 일정 수준을 넘어서면 병원체가 옮겨 갈 숙주를 찾지 못해 유행이 수그러드는데, 이를 집단 면역이라 한다. 덕분에 신생아나 면역 저하자처럼 접종이 어려운 사람들도 간접적으로 보호받는다. 문제는 근거 없는 괴담이 퍼지면서 접종을 기피하는 이들이 늘고 있다는 점이다. 개인의 선택이 공동체 전체의 안전과 직결된다는 사실을 되새길 필요가 있다.",
    "병원체=kasallik qo'zg'atuvchi|약화된:약화되다=zaiflashmoq|주입해:주입하다=yubormoq (in'eksiya)|대비하도록:대비하다=hozirlik ko'rmoq|훈련시킨다:훈련시키다=mashq qildirmoq|접종률=emlash qamrovi|일정=muayyan, belgilangan|옮겨 갈:옮겨 가다=o'tib ketmoq|숙주=xo'jayin organizm|수그러드는데:수그러들다=pasaymoq, bosilmoq|집단=guruh, jamoa|신생아=yangi tug'ilgan chaqaloq|저하자:저하=pasayish|접종=emlash|보호받는다:보호받다=himoyalanmoq|괴담=vahimali mish-mish|기피하는:기피하다=qochmoq, bo'yin tovlamoq|직결된다는:직결되다=bevosita bog'lanmoq",

  ["c3x", "O'qish odati o'zgarmoqda", "읽기의 변화", "화면으로 글을 읽는 일이 일상이 되면서 읽는 방식 자체가 변모하고 있다. 사람들은 긴 글을 처음부터 끝까지 정독하기보다 핵심어를 훑으며 건너뛰는 데 익숙해졌다. 이런 읽기는 정보를 재빨리 추려 내는 데에는 유리하지만 복잡한 논증을 따라가거나 인물의 내면에 공감하는 능력은 약화시킨다는 지적이 있다. 깊이 읽기는 타고나는 것이 아니라 훈련으로 길러지는 능력이다. 하루 중 일정 시간만이라도 기기를 치워 두고 종이책에 침잠하는 습관이 권장되는 이유이다.",

  ["c4x", "Sukutning qadri", "침묵의 가치", "대화가 끊기는 순간을 견디지 못하고 아무 말이나 꺼내는 사람이 많다. 침묵을 어색함이나 무능의 징표로 받아들이기 때문이다. 그러나 말과 말 사이의 여백은 상대의 이야기를 곱씹고 자신의 생각을 가다듬는 시간이다. 성급하게 조언을 건네기보다 묵묵히 들어 주는 태도가 상대에게 더 큰 위안이 될 때가 적지 않다. 말을 잘하는 사람보다 침묵을 편안하게 나눌 수 있는 사람이 오래 곁에 남는다.",

  ["c5x", "An'anaviy bozor", "전통 시장의 변신", "대형 마트와 온라인 쇼핑에 밀려 쇠락하던 전통 시장이 탈바꿈하고 있다. 낡은 지붕을 걷어 내고 주차장을 확충하는 것은 기본이고, 청년 상인들이 입점해 이색 먹거리를 선보이면서 젊은 층의 발걸음이 늘었다. 흥정하는 재미와 덤을 얹어 주는 인심은 마트에서는 맛볼 수 없는 시장만의 매력이다. 다만 시설 개선에만 치중하다 보면 어디서나 볼 수 있는 상가와 다를 바 없어진다. 그 시장에서만 만날 수 있는 이야기와 사람을 지켜 내는 것이 관건이다.",

  ["c6x", "Mukammallikka intilish", "완벽주의", "완벽주의자는 높은 기준을 세우고 그에 미치지 못하면 자신을 가혹하게 책망한다. 얼핏 성취의 원동력처럼 보이지만 실패에 대한 두려움 때문에 일을 차일피일 미루거나 아예 착수조차 못하는 경우가 흔하다. 결과가 흠잡을 데 없어야 한다는 강박이 오히려 수행을 저해하는 것이다. 심리학자들은 완성도보다 진척에 주목하고 실수를 배움의 재료로 재해석하라고 권한다. 스스로에게 너그러워지는 것은 나태가 아니라 지속하기 위한 조건이다.",

  ["c7x", "Yolg'izlik jamiyat muammosi", "외로움의 사회학", "통신 수단은 어느 때보다 발달했지만 외롭다고 호소하는 사람은 도리어 늘었다. 화면 너머로 주고받는 짧은 안부는 얼굴을 맞대고 나누는 대화가 주는 유대감을 대신하지 못하기 때문이다. 만성적인 외로움은 흡연에 버금갈 만큼 건강을 갉아먹는다는 연구 결과도 있다. 일부 국가는 외로움을 개인의 감정이 아닌 사회적 질병으로 규정하고 전담 부처를 신설했다. 이웃과 우연히 마주칠 수 있는 공간을 늘리는 도시 설계가 해법의 하나로 주목받고 있다.",

  ["c8x", "Taom va xotira", "음식과 기억", "어떤 음식은 맛보다 기억으로 먹는다. 비 오는 날 부침개가 당기는 것은 기름 튀는 소리가 빗소리를 닮아서라는 속설도 있지만, 어린 시절 온 식구가 둘러앉아 나눠 먹던 장면이 되살아나기 때문일 것이다. 후각과 미각은 감정을 관장하는 뇌 부위와 직통으로 이어져 있어 냄새 한 줄기만으로도 수십 년 전의 순간이 선명하게 소환된다. 타지에서 고향 음식을 찾아 헤매는 이들의 허기는 위장이 아니라 마음에서 비롯된 것이다. 음식은 한 사람의 지나온 세월을 고스란히 담고 있는 그릇이다.",

  ["c9x", "Qo'lda yozish", "손글씨와 느림", "자판을 두드리면 순식간에 글이 완성되는 시대에 굳이 손으로 글씨를 쓰는 사람들이 있다. 획 하나하나에 정성을 기울이는 동안 잡념이 걷히고 마음이 차분해진다는 것이다. 손글씨에는 쓰는 이의 성품과 그날의 기분이 묻어나기에 받는 사람에게도 각별한 울림을 준다. 효율만을 잣대로 삼으면 쓸모없어 보이는 일이지만, 느린 속도가 오히려 생각을 여물게 한다. 빠름에 지친 이들이 필사 모임에 모여드는 것은 우연이 아니다.",

  ["c10x", "Avlodlar tili", "세대와 새말", "신조어와 줄임말이 쏟아지면서 세대 간에 말이 통하지 않는다는 푸념이 들린다. 기성세대는 우리말이 망가진다고 개탄하고 젊은 세대는 그런 걱정을 고리타분하다고 여긴다. 그러나 언어는 본디 살아 움직이는 것이어서 쓰임새가 없는 말은 도태되고 필요한 말은 살아남아 사전에 오른다. 새말을 무턱대고 배척할 일도, 격식을 차려야 할 자리에서 남발할 일도 아니다. 상대와 상황을 가려 쓰는 분별력이야말로 세대를 잇는 다리가 된다.",

  ["c11x", "Sayohatning ma'nosi", "여행의 묘미", "명소 앞에서 인증 사진만 찍고 서둘러 다음 장소로 이동하는 여행이 적지 않다. 일정표를 빼곡히 채워야 본전을 뽑는다는 조바심 때문이다. 그러나 그렇게 다녀온 여행은 사진첩에는 남아도 마음에는 좀처럼 새겨지지 않는다. 골목을 정처 없이 거닐다가 우연히 들른 찻집에서 주인과 나눈 몇 마디가 훨씬 오래 기억에 남는 법이다. 여행의 묘미는 낯선 곳에서 일상의 속도를 내려놓는 데 있다.",

  ["ta5", "Mualliflik huquqi va ulashish", "저작권과 공유", "창작자에게 일정 기간 독점적 권리를 부여하는 저작권은 창작 의욕을 북돋우기 위한 장치이다. 그러나 보호가 지나치면 기존 작품을 발판으로 새로운 것을 빚어내는 길이 막힌다. 인류의 문화는 앞선 이들의 성취를 빌리고 비틀고 덧대며 풍성해져 왔기 때문이다. 이에 일부 창작자는 출처만 밝히면 누구나 자유롭게 쓸 수 있도록 자기 작품을 개방하고 있다. 권리의 보호와 지식의 공유 사이에서 접점을 찾는 일이 디지털 시대의 숙제이다.",

    ["저작권 보호와 지식 공유 사이의 균형을 찾아야 한다.", "저작권은 완전히 없애야 한다.", "저작권 보호는 강할수록 좋다.", "문화는 이전 작품과 관계없이 발전한다."],
    ["자기 작품을 누구나 쓸 수 있게 공개하는 창작자도 있다.", "저작권은 창작 의욕을 떨어뜨리려고 만든 제도이다.", "보호가 지나쳐도 새로운 창작에는 영향이 없다.", "출처를 밝혀도 다른 사람의 작품은 쓸 수 없다."]],
  ["ta6", "Qochqinlarni qabul qilish", "난민 수용", "전쟁과 박해를 피해 고국을 등진 난민의 수가 역대 최대치를 경신하고 있다. 수용국에서는 일자리를 빼앗기고 치안이 불안해질 것이라는 막연한 공포가 번지곤 한다. 그러나 여러 실증 연구는 난민이 정착 초기의 지원을 거쳐 납세자로 자리 잡으면 재정에 순기여한다는 결과를 내놓는다. 관건은 언어 교육과 직업 훈련을 조기에 제공해 자립을 앞당기는 것이다. 수용 여부를 둘러싼 소모적 공방에서 벗어나 어떻게 통합할 것인가로 논의의 축을 옮겨야 한다.",
    "박해=ta'qib|고국=ona vatan|등진:등지다=tark etmoq, orqa o'girmoq|역대=tarixdagi barcha (davrlar)|최대치=eng yuqori ko'rsatkich|경신하고:경신하다=yangilamoq (rekordni)|수용국=qabul qiluvchi davlat|빼앗기고:빼앗기다=tortib olinmoq|치안=jamoat tartibi|실증=amaliy isbot, empirik|납세자=soliq to'lovchi|순기여한다는:순기여하다=sof hissa qo'shmoq|내놓는다:내놓다=taqdim etmoq, chiqarmoq|조기=erta bosqich|앞당기는:앞당기다=tezlashtirmoq, oldinga surmoq|여부=bor-yo'qligi, ha yoki yo'qligi|소모적=behuda kuch sarflaydigan|공방=tortishuv, hujum-himoya|통합할:통합하다=birlashtirmoq, integratsiya qilmoq|논의=muhokama|축=o'q, markaz",
    ["난민을 받을지 다투기보다 어떻게 통합할지를 논의해야 한다.", "난민은 받아들이면 안 된다.", "난민은 재정에 부담만 된다.", "난민에게는 지원이 필요하지 않다."],
    ["난민이 자리를 잡으면 재정에 도움이 된다는 연구가 있다.", "난민의 수는 줄어들고 있다.", "언어 교육은 늦게 할수록 좋다.", "수용국 주민들은 난민을 전혀 걱정하지 않는다."]],
  ["ta7", "Kuzatuv kameralari", "감시와 자유", "골목마다 설치된 폐쇄 회로 카메라는 범죄를 억지하고 수사에 요긴한 단서를 제공한다. 그러나 누가 언제 어디를 지나갔는지가 낱낱이 기록되는 사회에서 시민은 은연중에 스스로를 검열하게 된다. 안면 인식 기술이 결합되면 익명으로 거리를 걸을 자유는 사실상 소멸한다. 안전을 명분으로 수집된 정보가 다른 용도로 전용되는 것을 막을 장치도 허술하다. 촬영 범위와 보관 기간을 법으로 엄격히 한정하고 독립 기구가 이를 감독해야 한다.",
    "폐쇄 회로=yopiq zanjirli (kuzatuv kamerasi)|억지하고:억지하다=tiyib turmoq, oldini olmoq|요긴한:요긴하다=juda asqotadigan|단서=dalil ipi, kalit|지나갔는지가:지나가다=o'tib ketmoq|은연중에=o'zi sezmagan holda|검열하게:검열하다=senzura qilmoq|안면 인식=yuzni tanish texnologiyasi|결합되면:결합되다=birlashmoq|소멸한다:소멸하다=yo'q bo'lmoq|수집된:수집되다=yig'ilmoq|용도=foydalanish maqsadi|전용되는:전용되다=boshqa maqsadga ishlatilmoq|허술하다=bo'sh, puxta emas|촬영=suratga olish|엄격히=qat'iy|한정하고:한정하다=cheklamoq|감독해야:감독하다=nazorat qilmoq",
    ["감시 카메라의 사용 범위를 법으로 제한하고 감독해야 한다.", "감시 카메라는 많을수록 좋다.", "감시 카메라는 모두 없애야 한다.", "수집된 정보는 어디에 써도 문제가 없다."],
    ["모든 이동이 기록되면 사람들은 스스로 행동을 조심하게 된다.", "감시 카메라는 수사에 도움이 되지 않는다.", "안면 인식 기술은 익명성을 지켜 준다.", "정보의 다른 용도 사용을 막는 장치는 충분하다."]],
  ["ta8", "Mahalliy pul", "지역 화폐", "지역 화폐는 발행한 지자체 안에서만 쓸 수 있는 상품권이다. 대형 유통업체로 빠져나가던 돈을 골목 상권에 묶어 두려는 취지에서 도입되었다. 구매 금액의 일부를 지자체가 보태 주기 때문에 소비자의 호응은 뜨겁다. 그러나 할인 비용을 세금으로 메우는 구조여서 예산이 바닥나면 효과도 꺼진다는 반론이 있다. 인접 지역의 소비를 끌어올 뿐 전체 소비를 늘리지는 못한다는 지적도 귀담아들을 만하다.",
    "화폐=pul birligi|발행한:발행하다=muomalaga chiqarmoq|상품권=xarid sertifikati|유통업체=savdo tarmog'i korxonasi|빠져나가던:빠져나가다=chiqib ketmoq|상권=savdo hududi|도입되었다:도입되다=joriy etilmoq|보태:보태다=qo'shib bermoq|호응=ijobiy javob, qo'llab-quvvatlash|뜨겁다=qaynoq|메우는:메우다=to'ldirmoq (kamomadni)|바닥나면:바닥나다=tugab qolmoq|꺼진다는:꺼지다=o'chmoq|반론=e'tiroz|인접=qo'shni, tutash|끌어올:끌어오다=tortib kelmoq|귀담아들을:귀담아듣다=diqqat bilan tinglamoq",
    ["지역 화폐의 효과에는 한계가 있다는 지적도 살펴야 한다.", "지역 화폐는 전체 소비를 크게 늘린다.", "지역 화폐는 소비자에게 인기가 없다.", "지역 화폐는 전국 어디서나 쓸 수 있다."],
    ["지역 화폐의 할인 비용은 세금으로 채운다.", "지역 화폐는 대형 유통업체를 돕기 위해 만들었다.", "예산이 없어도 효과는 계속된다.", "지자체는 구매 금액을 보태 주지 않는다."]],
  ["ta9", "Ichki fosh etuvchilar", "내부 고발", "조직의 비리를 외부에 알린 내부 고발자는 종종 배신자로 낙인찍혀 따돌림과 보복에 시달린다. 해고를 당하거나 업계에서 발붙이지 못하게 되는 일도 허다하다. 그러나 대형 참사의 상당수는 내부의 경고가 묵살된 끝에 터졌다. 공익을 위해 침묵을 깬 이들을 법으로 감싸고 불이익을 준 조직을 엄벌하는 것은 사회 전체의 안전을 위한 투자이다. 고발자가 영웅으로 추앙받을 필요는 없지만 적어도 생계를 위협받지는 않아야 한다.",
    "외부=tashqi tomon|내부 고발자=ichkaridan fosh etuvchi|배신자=xoin|낙인찍혀:낙인찍히다=tamg'a bosilmoq|따돌림=chetlatish, kamsitish|보복=qasos|발붙이지:발붙이다=oyoq qo'yib joy topmoq|허다하다=juda ko'p uchraydi|내부=ichki tomon|묵살된:묵살되다=e'tiborsiz qoldirilmoq|터졌다:터지다=portlamoq, yuz bermoq|공익=jamoat manfaati|감싸고:감싸다=o'rab himoya qilmoq|불이익=zarar, ziyon|엄벌하는:엄벌하다=qattiq jazolamoq|영웅=qahramon|추앙받을:추앙받다=ulug'lanmoq|위협받지는:위협받다=tahdid ostida qolmoq",
    ["공익을 위해 비리를 알린 사람을 법으로 보호해야 한다.", "내부 고발자는 조직을 배신한 사람이므로 벌해야 한다.", "내부의 경고는 참사와 관계가 없다.", "내부 고발자는 반드시 영웅으로 대접해야 한다."],
    ["많은 큰 사고는 내부의 경고를 무시한 뒤에 일어났다.", "내부 고발자는 대부분 조직에서 환영받는다.", "고발 후에 해고되는 일은 거의 없다.", "비리를 알리면 업계에서 일자리를 쉽게 구한다."]],
  ["ta10", "Nafaqa va mehnat ishtiyoqi", "복지와 근로 의욕", "복지 급여가 넉넉하면 사람들이 일손을 놓을 것이라는 통념은 뿌리가 깊다. 그러나 조건 없이 현금을 지급한 여러 실험에서 수급자의 노동 시간은 거의 줄지 않았고, 줄어든 경우에도 학업이나 육아에 시간을 돌린 것으로 드러났다. 오히려 당장의 끼니 걱정에서 놓여난 사람들이 더 나은 일자리를 탐색하고 창업에 도전하는 모습이 관찰되었다. 가난이 게으름의 결과라는 전제부터 의심해 볼 일이다. 빈곤은 의지의 결핍이 아니라 선택지의 결핍인 경우가 많다.",
    "급여=to'lov, nafaqa|일손=ish qo'li|뿌리가 깊다=ildizi chuqur|수급자=nafaqa oluvchi|줄지:줄다=kamaymoq|당장=shu zahoti, hozirning o'zida|끼니=bir mahal ovqat|놓여난:놓여나다=xalos bo'lmoq|탐색하고:탐색하다=izlab ko'rmoq|모습=qiyofa, ko'rinish|관찰되었다:관찰되다=kuzatilmoq|게으름=dangasalik|결핍=yetishmovchilik",
    ["가난은 게으름이 아니라 선택할 기회가 부족해서 생기는 경우가 많다.", "복지가 넉넉하면 사람들은 일을 그만둔다.", "현금을 받은 사람들은 모두 일을 하지 않았다.", "가난한 사람은 의지가 부족하다."],
    ["현금을 받은 사람들이 더 좋은 일자리를 찾거나 창업을 시도했다.", "실험에서 노동 시간이 크게 줄었다.", "줄어든 시간은 대부분 놀이에 쓰였다.", "조건 없는 현금 지급 실험은 한 번도 없었다."]],
  ["ta11", "Ko'pchilik va ozchilik huquqi", "다수결과 기본권", "민주주의는 흔히 다수결과 동일시되지만 다수의 뜻이 언제나 옳은 것은 아니다. 다수가 합심하여 소수의 권리를 짓밟는 일을 역사는 숱하게 보여 주었다. 헌법이 표결로도 침해할 수 없는 기본권을 명시해 둔 까닭이 여기에 있다. 선출되지 않은 재판관이 국회가 만든 법률을 무효로 돌릴 수 있는 것도 다수의 횡포를 견제하기 위해서이다. 다수결은 민주주의의 수단일 뿐 그 자체가 목적은 아니다.",
    "다수결=ko'pchilik ovozi bilan qaror|동일시되지만:동일시되다=aynan bir deb qaralmoq|옳은:옳다=to'g'ri, haq|합심하여:합심하다=bir yoqadan bosh chiqarmoq|짓밟는:짓밟다=toptamoq|숱하게=behisob ko'p|표결=ovozga qo'yish|침해할:침해하다=buzmoq (huquqni)|기본권=asosiy huquqlar|명시해:명시하다=aniq yozib ko'rsatmoq|선출되지:선출되다=saylanmoq|재판관=sudya|무효=haqiqiy emas, bekor|횡포=zo'ravonlik, o'zboshimchalik|견제하기:견제하다=tiyib muvozanatlamoq",
    ["민주주의에서는 다수의 결정으로부터 소수의 권리를 지키는 장치가 필요하다.", "다수의 뜻은 언제나 옳다.", "민주주의는 다수결과 완전히 같은 것이다.", "재판관은 법률에 대해 판단할 수 없다."],
    ["헌법은 표결로도 빼앗을 수 없는 권리를 정해 두었다.", "역사에서 다수가 소수를 억압한 일은 없었다.", "재판관은 국민이 직접 뽑는다.", "다수결은 민주주의의 목적이다."]],
  ["ta12", "Soliq va adolat", "세금과 형평", "세금은 누구에게 얼마를 물리느냐에 따라 사회의 모습을 바꾼다. 소득이 높을수록 높은 세율을 매기는 누진세는 부의 편중을 누그러뜨리지만, 지나치면 근로와 투자 의욕을 꺾는다는 비판을 받는다. 반대로 물건값에 붙는 소비세는 걷기 쉬운 대신 저소득층일수록 소득 대비 부담이 무거워지는 역진성을 띤다. 어떤 세금이든 탈루를 막지 못하면 성실한 납세자만 손해를 본다. 조세 제도의 정당성은 세율보다도 공평하게 집행된다는 믿음에서 나온다.",
    "물리느냐에:물리다=undirmoq (soliq, jarima)|소득=daromad|세율=soliq stavkasi|매기는:매기다=belgilamoq (baho, soliq)|누진세=progressiv soliq|부=boylik|편중=bir joyga to'planish|누그러뜨리지만:누그러뜨리다=yumshatmoq|꺾는다는:꺾다=sindirmoq|물건값=buyum narxi|소비세=iste'mol solig'i|대비=…ga nisbatan|역진성=regressivlik|띤다:띠다=ega bo'lmoq (xususiyatga)|탈루=soliqdan yashirish|조세=soliq tizimi|정당성=haqqoniylik, legitimlik|공평하게:공평하다=adolatli, teng|집행된다는:집행되다=ijro etilmoq",
    ["세금 제도는 공평하게 집행된다는 믿음이 있어야 정당성을 얻는다.", "세율이 높을수록 좋은 세금 제도이다.", "소비세는 저소득층에게 유리하다.", "탈루는 세금 제도에 영향을 주지 않는다."],
    ["소비세는 소득이 낮은 사람에게 상대적으로 더 무겁다.", "누진세는 부의 편중을 심하게 만든다.", "소비세는 걷기가 매우 어렵다.", "누진세에는 아무런 비판이 없다."]],
  ["ta13", "Urush xotirasi", "전쟁과 기억", "전쟁 기념관은 무엇을 기억하고 무엇을 망각할지를 선택하는 공간이다. 승전의 영광만을 전시하면 전쟁은 낭만적인 무용담으로 포장되고 희생자의 참상은 지워진다. 가해의 역사를 외면한 채 피해만을 부각하는 전시 역시 온전한 기억이라 할 수 없다. 최근 몇몇 기념관은 병사의 편지와 민간인의 증언을 나란히 놓아 관람객이 스스로 질문을 던지게 한다. 기억의 목적은 원한을 대물림하는 데 있지 않고 같은 비극을 되풀이하지 않는 데 있다.",

  ["ta14", "Mehnat muhojirlari", "이주 노동자", "농촌과 공장의 일손 부족을 메우는 이주 노동자 없이는 이제 한국 경제가 돌아가지 않는다. 그럼에도 이들은 사업장을 옮길 자유가 제한되고 열악한 숙소에서 지내는 일이 잦다. 임금 체불을 당해도 체류 자격을 잃을까 두려워 신고를 주저한다. 필요할 때 불러 쓰고 소용이 다하면 돌려보내는 방식은 인권 침해 논란을 넘어 숙련 인력의 유출이라는 손실로 되돌아온다. 함께 살아갈 이웃으로 대우하는 제도 정비가 인구 감소 시대의 현실적 해법이다.",

  ["sb1", "Shahar issiqlik oroli", "도시 열섬", "도심의 기온이 주변보다 높게 나타나는 열섬 현상은 아스팔트와 콘크리트가 낮 동안 흡수한 열을 밤새 내뿜기 때문에 생긴다. 빽빽한 고층 건물은 바람길을 가로막아 열기가 빠져나가지 못하게 한다. 에어컨 실외기가 토해 내는 더운 공기는 다시 냉방 수요를 키우는 되먹임을 낳는다. 옥상에 정원을 가꾸고 도로에 물을 뿌리는 것은 임시방편에 지나지 않는다. 도시를 설계할 때부터 숲과 물길을 촘촘히 엮어 넣어야 한다.",

  ["sb2", "Asalarilar yo'qolmoqda", "사라지는 꿀벌", "꿀벌이 사라지고 있다는 경고음이 세계 곳곳에서 울린다. 꿀벌은 꿀을 만들 뿐 아니라 인류가 먹는 작물의 삼분의 일가량을 수분시키는 일꾼이다. 살충제에 노출된 벌은 방향 감각을 잃어 벌집으로 귀환하지 못하고, 이상 기온은 꽃이 피는 시기와 벌의 활동기를 어긋나게 한다. 단일 작물만 대규모로 심는 농법도 벌의 먹이를 단조롭게 만들어 면역력을 떨어뜨린다. 꿀벌의 위기는 곧 밥상의 위기라는 인식 아래 서식 환경을 되살려야 한다.",

    ["꿀벌이 살 수 있는 환경을 되살려야 식량도 지킬 수 있다.", "꿀벌이 사라져도 농업에는 영향이 없다.", "살충제는 꿀벌에게 해롭지 않다.", "한 가지 작물만 심는 것이 꿀벌에게 좋다."],

  ["sb3", "Dengiz sayozligi", "갯벌의 가치", "밀물과 썰물이 드나드는 갯벌은 한때 쓸모없는 땅으로 여겨져 간척의 대상이 되었다. 그러나 갯벌은 육지에서 흘러든 오염 물질을 걸러 내는 천연 정화조이자 철새가 쉬어 가는 중간 기착지이다. 무수한 조개와 게가 깃들어 살며 어민의 생계를 떠받친다. 최근에는 갯벌의 퇴적층이 숲 못지않게 탄소를 가두어 둔다는 사실이 알려져 가치가 재평가되고 있다. 메워서 얻는 땅보다 그대로 둘 때의 이익이 훨씬 크다는 것이 뒤늦은 깨달음이다.",

    ["갯벌은 메우는 것보다 그대로 보전하는 것이 더 이롭다.", "갯벌은 쓸모없는 땅이다.", "갯벌을 메워 땅을 늘려야 한다.", "갯벌은 탄소를 저장하지 못한다."],
    ["갯벌은 육지에서 온 오염 물질을 걸러 준다.", "철새는 갯벌을 피해서 지나간다.", "갯벌에는 생물이 거의 살지 않는다.", "갯벌의 가치는 예전부터 높이 평가되었다."]],
  ["sb4", "Piyodabop shahar", "걷기 좋은 도시", "자동차 중심으로 설계된 도시에서 보행자는 늘 뒷전이었다. 넓은 차도는 동네를 갈라놓고 긴 신호 대기는 걷기를 고역으로 만든다. 그러나 차로를 줄이고 인도를 넓힌 거리에서는 상점 매출이 오르고 교통사고가 준다는 것이 여러 도시에서 확인되었다. 걷는 사람이 늘면 거리에 눈이 많아져 범죄도 움츠러든다. 도시의 활력은 차량의 통행 속도가 아니라 사람들이 머무는 시간에 비례한다.",
    "중심=markaz|뒷전=ikkinchi o'rin, e'tibordan chetda|차도=qatnov qismi|갈라놓고:갈라놓다=ajratib qo'ymoq|신호=signal, svetofor ishorasi|고역=azobli ish|차로=yo'l tasmasi|인도=piyodalar yo'lagi|넓힌:넓히다=kengaytirmoq|상점=do'kon|확인되었다:확인되다=tasdiqlanmoq|움츠러든다:움츠러들다=tortilib qolmoq, kamaymoq|활력=hayotiy kuch|통행=o'tish, qatnov|비례한다:비례하다=mutanosib bo'lmoq",
    ["사람이 걷고 머물기 좋은 거리가 도시를 살린다.", "차로를 넓혀야 도시가 발전한다.", "보행자가 늘면 범죄도 늘어난다.", "도시의 활력은 차량 속도에 달려 있다."],
    ["인도를 넓힌 거리에서는 가게의 매출이 늘었다.", "차로를 줄이자 교통사고가 늘었다.", "넓은 차도는 동네를 하나로 이어 준다.", "자동차 중심 도시에서 보행자는 가장 먼저 고려되었다."]],
  ["sb5", "Shakarga qaramlik", "단맛의 덫", "단맛은 뇌의 보상 회로를 자극해 쾌감을 일으킨다. 문제는 자극이 반복될수록 같은 만족을 얻기 위해 더 많은 양을 갈구하게 된다는 점이다. 가공식품에는 짠맛이나 신맛에 가려 느끼지 못하는 당이 듬뿍 숨어 있어 자신도 모르는 사이 권장량을 훌쩍 넘기기 일쑤이다. 과잉 섭취된 당은 지방으로 전환되어 간에 쌓이고 각종 대사 질환의 불씨가 된다. 성분표를 꼼꼼히 읽는 습관과 더불어 당류 함량을 눈에 띄게 표시하도록 하는 규제가 요구된다.",
    "단맛=shirin ta'm|보상 회로=miyadagi mukofot tizimi|자극해:자극하다=qo'zg'atmoq|쾌감=huzur|일으킨다:일으키다=keltirib chiqarmoq, uyg'otmoq|자극=qo'zg'atuvchi ta'sir|갈구하게:갈구하다=tashna bo'lmoq|짠맛=sho'r ta'm|신맛=nordon ta'm|당=shakar moddasi|듬뿍=mo'l-ko'l|권장량=tavsiya etilgan miqdor|넘기기:넘기다=oshirib yubormoq|과잉=ortiqcha|전환되어:전환되다=aylanmoq|간=jigar|각종=turli xil|대사=modda almashinuvi|불씨=uchqun, sabab|성분표=tarkib jadvali|당류=shakarlar|함량=tarkibdagi miqdor",
    ["당 섭취를 줄이려면 개인의 습관과 함께 표시 규제도 필요하다.", "단맛은 뇌에 아무 영향을 주지 않는다.", "가공식품에는 당이 거의 없다.", "당은 많이 먹을수록 건강에 좋다."],
    ["남은 당은 지방으로 바뀌어 간에 쌓인다.", "단맛에 익숙해지면 더 적은 양으로도 만족한다.", "가공식품의 당은 쉽게 느낄 수 있다.", "사람들은 대부분 권장량보다 적게 먹는다."]],
  ["sb6", "Sport va miya", "운동과 뇌", "운동은 근육만 단련하는 것이 아니다. 숨이 찰 정도로 몸을 움직이면 뇌로 가는 혈류가 늘고 신경 세포의 생성을 촉진하는 물질이 분비된다. 꾸준히 달리기를 한 집단이 기억력 검사에서 두드러지게 나은 성적을 거두었다는 연구도 있다. 우울과 불안을 누그러뜨리는 효과는 약물에 견줄 만하다는 평가를 받는다. 책상 앞에 붙박여 있는 시간을 쪼개 몸을 쓰는 것이 머리를 쓰는 지름길인 셈이다.",
    "단련하는:단련하다=chiniqtirmoq|숨이 찰:숨이 차다=nafasi qismoq|혈류=qon oqimi|생성=hosil bo'lish|분비된다:분비되다=ajralib chiqmoq|기억력=xotira kuchi|두드러지게:두드러지다=ko'zga tashlanmoq|거두었다는:거두다=qo'lga kiritmoq, yig'moq|우울=tushkunlik|불안=xavotir, bezovtalik|약물=dori modda|견줄:견주다=tenglashtirmoq, solishtirmoq|평가=baho|붙박여:붙박이다=mixlanib qolmoq|쪼개:쪼개다=bo'lmoq, yormoq",
    ["몸을 움직이는 것은 뇌의 기능과 정신 건강에도 도움이 된다.", "운동은 근육에만 영향을 준다.", "운동은 기억력을 떨어뜨린다.", "운동은 우울과 불안을 더 심하게 만든다."],
    ["꾸준히 달린 사람들이 기억력 검사에서 더 좋은 결과를 얻었다.", "운동을 하면 뇌로 가는 혈류가 줄어든다.", "운동의 효과는 약물과 비교할 수 없을 만큼 작다.", "오래 앉아 있는 것이 머리를 쓰는 데 가장 좋다."]],
  ["sb7", "Suv tanqisligi", "물 부족", "지구 표면의 대부분은 물로 덮여 있지만 인간이 쓸 수 있는 담수는 극소량에 불과하다. 그마저도 지역에 따라 편재되어 있어 한쪽에서는 홍수로 몸살을 앓고 다른 쪽에서는 우물이 말라붙는다. 농업용수로 퍼 올린 지하수는 다시 채워지는 속도보다 훨씬 빠르게 고갈되고 있다. 강의 상류에 댐을 쌓는 나라와 하류에서 물줄기가 가늘어진 나라 사이에 분쟁의 불씨도 자란다. 물을 공짜에 가까운 자원으로 취급해 온 관행부터 손질해야 한다.",
    "표면=yuza|덮여:덮이다=qoplanmoq|인간=inson|담수=chuchuk suv|극소량=juda oz miqdor|그마저도=hatto o'sha ham|편재되어:편재되다=notekis taqsimlanmoq|한쪽=bir tomon|몸살을 앓고:몸살을 앓다=azob chekmoq|우물=quduq|말라붙는다:말라붙다=qurib qolmoq|농업용수=sug'orish suvi|퍼 올린:퍼 올리다=tortib chiqarmoq|지하수=yer osti suvi|상류=daryoning yuqori oqimi|댐=to'g'on|하류=quyi oqim|물줄기=suv oqimi|가늘어진:가늘다=ingichka|공짜=tekin|취급해:취급하다=deb qaramoq, muomala qilmoq|손질해야:손질하다=tuzatib tartibga keltirmoq",
    ["물을 값싼 자원으로 다루어 온 관행을 고쳐야 한다.", "지구에는 쓸 수 있는 물이 충분하다.", "지하수는 써도 금방 다시 채워진다.", "물 때문에 나라 사이에 갈등이 생길 일은 없다."],
    ["지하수는 채워지는 것보다 빠르게 줄어들고 있다.", "담수는 지역마다 고르게 나뉘어 있다.", "사람이 쓸 수 있는 물은 지구 물의 대부분이다.", "상류에 댐을 쌓으면 하류의 물이 늘어난다."]],
  ["sb8", "Ruhiy charchash", "번아웃", "번아웃은 단순한 피로가 아니라 오랜 기간 누적된 업무 스트레스로 정서가 고갈된 상태를 가리킨다. 일에 대한 열의가 식고 냉소가 짙어지며 자신이 무가치하다는 느낌에 사로잡힌다. 휴가를 다녀와도 금세 원점으로 돌아간다면 개인의 회복력이 아니라 업무 환경을 점검해야 한다. 과도한 업무량, 모호한 역할, 노력에 걸맞지 않은 보상이 주된 원인으로 꼽힌다. 버티는 것을 능력으로 치켜세우는 조직 문화가 바뀌지 않는 한 번아웃은 되풀이될 수밖에 없다.",
    "번아웃=ruhiy charchash, kuyib bitish|누적된:누적되다=yig'ilib bormoq|상태=holat|열의=g'ayrat|식고:식다=sovimoq|짙어지며:짙다=quyuq|무가치하다는:무가치하다=qadrsiz|느낌=his, tuyg'u|사로잡힌다:사로잡히다=asir bo'lmoq (hisga)|원점=boshlang'ich nuqta|회복력=tiklanish qobiliyati|점검해야:점검하다=tekshirib chiqmoq|과도한:과도하다=haddan ortiq|업무량=ish hajmi|주된=asosiy|꼽힌다:꼽히다=sanalmoq|버티는:버티다=chidab turmoq|치켜세우는:치켜세우다=ko'kka ko'tarmoq",
    ["번아웃을 줄이려면 버티기를 칭찬하는 조직 문화를 바꿔야 한다.", "번아웃은 휴가만 다녀오면 해결된다.", "번아웃은 개인의 의지가 약해서 생긴다.", "번아웃은 단순히 몸이 피곤한 것이다."],
    ["노력에 맞지 않는 보상이 번아웃의 원인 가운데 하나이다.", "번아웃이 오면 일에 대한 열의가 커진다.", "역할이 분명할수록 번아웃이 심해진다.", "번아웃은 짧은 기간의 스트레스로 생긴다."]],
  ["sb9", "Isrof bo'layotgan oziq-ovqat", "버려지는 음식", "생산된 식량의 삼분의 일은 식탁에 오르기도 전에 버려진다. 모양이 비뚤다는 이유로 밭에서 폐기되는 채소, 유통기한이 임박해 매대에서 치워지는 식품, 넉넉히 차렸다가 남긴 음식이 모두 여기에 든다. 버려진 음식은 썩으면서 온실가스를 뿜어내 기후 위기를 가중한다. 한편에서는 굶주림이 계속되는데 다른 한편에서는 멀쩡한 음식이 쓰레기가 되는 모순이다. 못난이 농산물을 싸게 판매하고 남는 식품을 기부처와 이어 주는 시도가 확산되어야 한다.",
    "생산된:생산되다=ishlab chiqarilmoq|버려진다:버려지다=tashlab yuborilmoq|비뚤다는:비뚤다=qiyshiq|폐기되는:폐기되다=chiqitga chiqarilmoq|임박해:임박하다=yaqinlashib qolmoq|매대=savdo peshtaxtasi|치워지는:치워지다=olib tashlanmoq|넉넉히=mo'l qilib|썩으면서:썩다=chirimoq|뿜어내:뿜어내다=purkab chiqarmoq|가중한다:가중하다=og'irlashtirmoq|굶주림=ochlik|멀쩡한:멀쩡하다=butun, yaroqli|못난이=shakli xunuk (mahsulot)|농산물=qishloq xo'jaligi mahsuloti|기부처=xayriya qabul qiluvchi joy|시도=urinish",
    ["버려지는 음식을 줄이려는 시도가 더 널리 퍼져야 한다.", "음식물 쓰레기는 기후와 관계가 없다.", "모양이 나쁜 채소는 버리는 것이 옳다.", "세계에는 굶주리는 사람이 없다."],
    ["모양이 좋지 않다는 이유로 밭에서 버려지는 채소가 있다.", "생산된 식량은 대부분 남김없이 소비된다.", "버려진 음식은 썩어도 가스를 내지 않는다.", "유통기한이 가까운 식품은 더 비싸게 팔린다."]],
  ["sb10", "Shahardagi yovvoyi hayvonlar", "도시와 야생 동물", "숲이 줄고 도시가 팽창하면서 멧돼지나 너구리가 주택가에 출몰하는 일이 잦아졌다. 먹이를 찾아 내려온 동물은 쓰레기 봉투를 헤집고 때로는 사람을 위협한다. 포획과 사살로 대응하는 것은 당장의 불안을 가라앉힐 뿐 근본 처방이 못 된다. 서식지를 잇는 생태 통로를 조성하고 음식물 쓰레기를 밀폐 용기에 배출하도록 하는 편이 효과적이다. 야생 동물과의 충돌은 그들이 침입했다기보다 우리가 그들의 터전으로 밀고 들어간 결과임을 되새겨야 한다.",
    "팽창하면서:팽창하다=kengaymoq, shishmoq|멧돼지=yovvoyi cho'chqa|너구리=yenotsimon it|주택가=turar joy mavzesi|출몰하는:출몰하다=paydo bo'lib turmoq|봉투=xalta, konvert|헤집고:헤집다=titkilamoq|때로는=ba'zan|위협한다:위협하다=tahdid qilmoq|사살=otib o'ldirish|근본=tub, asos|생태 통로=ekologik yo'lak|조성하고:조성하다=barpo etmoq|밀폐=zich yopish|용기=idish|배출하도록:배출하다=chiqarmoq, tashlamoq|야생=yovvoyi|침입했다기보다:침입하다=bostirib kirmoq|터전=makon, yashash joyi|밀고 들어간:밀고 들어가다=surib kirmoq",
    ["야생 동물과의 충돌을 줄이려면 서식지를 잇고 쓰레기를 관리해야 한다.", "도시에 나타난 야생 동물은 모두 사살해야 한다.", "야생 동물은 사람을 전혀 위협하지 않는다.", "야생 동물이 도시에 오는 것은 사람과 관계가 없다."],
    ["동물들은 먹이를 찾으러 주택가로 내려온다.", "숲이 늘어나면서 동물이 도시에 나타난다.", "포획은 문제를 근본적으로 해결한다.", "야생 동물이 도시에 나타나는 일은 줄어들었다."]],
  ["sb11", "Platsebo ta'siri", "위약 효과", "아무 약효가 없는 가짜 약을 먹고도 증상이 호전되는 현상을 위약 효과라 한다. 나을 것이라는 기대가 뇌에서 진통 물질의 분비를 이끌어 내기 때문이다. 흥미롭게도 알약보다 주사가, 싼 약보다 비싼 약이 더 큰 효과를 낸다. 의사가 환자의 말을 귀 기울여 듣고 확신에 찬 어조로 설명하는 것만으로도 치료 성과가 달라진다. 치료는 약물과 몸의 화학 반응만이 아니라 의료진과 환자가 맺는 신뢰의 산물이기도 하다.",
    "약효=dori ta'siri|가짜=soxta|호전되는:호전되다=yaxshilanmoq (ahvol)|위약=platsebo|효과=ta'sir, samara|기대=kutish, umid|진통=og'riq qoldirish|분비=ajralib chiqish|이끌어 내기:이끌어 내다=yuzaga chiqarmoq|흥미롭게도:흥미롭다=qiziqarli|알약=tabletka|확신=qat'iy ishonch|찬:차다=to'lmoq|산물=mahsul, natija",
    ["치료에는 의료진과 환자 사이의 신뢰도 중요한 역할을 한다.", "위약 효과는 실제로 존재하지 않는다.", "약의 값은 효과와 아무 관계가 없다.", "의사의 태도는 치료 결과에 영향을 주지 않는다."],
    ["비싼 가짜 약이 싼 가짜 약보다 효과가 더 크게 나타난다.", "알약이 주사보다 위약 효과가 크다.", "위약 효과는 기대와 관계없이 나타난다.", "가짜 약을 먹으면 증상이 항상 나빠진다."]],
  ["sb12", "Okeanning kislotalashuvi", "바다의 산성화", "바다는 인류가 배출한 이산화탄소의 약 사분의 일을 빨아들여 온난화의 속도를 늦춰 주었다. 그 대가로 바닷물의 산성도가 높아지고 있다. 산성화된 물에서는 조개와 산호가 껍데기와 골격을 만드는 데 필요한 탄산칼슘이 녹아 버린다. 먹이 사슬의 밑바닥을 이루는 작은 생물이 타격을 받으면 그 여파는 대형 어류와 어업에까지 미친다. 눈에 보이지 않는 바닷속의 변화가 식탁과 일자리를 뒤흔들 수 있다는 경각심이 필요하다.",
    "빨아들여:빨아들이다=so'rib olmoq|바닷물=dengiz suvi|산성도=kislotalilik darajasi|산성화된:산성화되다=kislotalashmoq|산호=marjon|껍데기=qobiq|골격=skelet|탄산칼슘=kalsiy karbonat|녹아:녹다=erimoq|밑바닥=eng tub|이루는:이루다=tashkil etmoq|타격=zarba|여파=oqibat to'lqini|어류=baliqlar|어업=baliqchilik|뒤흔들:뒤흔들다=larzaga solmoq|경각심=hushyorlik",
    ["바다의 산성화가 식량과 일자리에 미칠 영향을 경계해야 한다.", "바다는 이산화탄소를 흡수하지 않는다.", "산성화는 큰 물고기에게만 영향을 준다.", "바다의 변화는 사람의 생활과 관계가 없다."],
    ["산성화된 물에서는 조개가 껍데기를 만들기 어렵다.", "바닷물의 산성도는 낮아지고 있다.", "작은 생물이 줄어도 어업에는 영향이 없다.", "바다는 온난화를 더 빠르게 만들었다."]],
  ["sb13", "Yarim yerto'la uylar", "반지하와 건강", "볕이 들지 않고 환기가 어려운 반지하 주택은 습기와 곰팡이에 취약하다. 이런 환경에 오래 거주하면 호흡기 질환과 우울 증세가 늘어난다는 조사 결과가 있다. 집중 호우 때마다 침수 피해가 되풀이되어 인명 사고로 이어지기도 한다. 그럼에도 도심의 값싼 거처를 찾는 이들에게는 달리 선택지가 없는 경우가 많다. 단순히 건축을 금지하는 데 그칠 것이 아니라 거주자가 옮겨 갈 수 있는 저렴한 공공 주택을 넉넉히 공급하는 일이 선행되어야 한다.",
    "볕=quyosh nuri|환기=shamollatish|반지하=yarim yerto'la|곰팡이=mog'or|호흡기=nafas yo'llari|증세=alomat|집중 호우=kuchli jala|되풀이되어:되풀이되다=takrorlanmoq|인명=inson hayoti|값싼:값싸다=arzon|거처=turar joy, boshpana|달리=boshqacha|거주자=istiqomat qiluvchi|공급하는:공급하다=ta'minlamoq",
    ["반지하 문제는 옮겨 갈 공공 주택을 먼저 마련해야 풀 수 있다.", "반지하 주택은 건강에 영향을 주지 않는다.", "반지하 건축만 금지하면 문제가 해결된다.", "반지하에 사는 사람들은 다른 선택지가 많다."],

  ["sb14", "Diqqatning parchalanishi", "주의력과 알림", "스마트폰 알림은 평균 몇 분에 한 번꼴로 우리의 주의를 낚아챈다. 한번 흐트러진 집중을 되찾는 데에는 이십 분 넘게 걸린다는 연구가 있다. 여러 일을 동시에 처리한다고 믿지만 실은 과제 사이를 빠르게 오가며 그때마다 전환 비용을 치르는 것이다. 이런 상태가 만성화되면 깊이 생각하는 힘이 무뎌지고 피로만 쌓인다. 알림을 꺼 두는 시간대를 정하고 한 번에 한 가지 일에 몰입하는 훈련이 생산성을 되찾는 첩경이다.",

  ["hc1", "O'zgarayotgan muzey", "박물관의 변신", "박물관은 더 이상 유리 진열장 너머로 유물을 우러러보는 엄숙한 장소가 아니다. 관람객이 복제품을 직접 만져 보고 당시의 옷을 입어 보는 체험형 전시가 대세가 되었다. 실감 영상으로 사라진 건축물을 되살려 그 안을 거니는 듯한 느낌을 주기도 한다. 볼거리에 치우쳐 유물 본연의 의미가 묻힌다는 우려가 없지 않지만, 문턱을 낮춘 덕에 발길을 끊었던 젊은 세대가 돌아온 것은 분명한 성과이다. 과거를 박제하는 곳에서 과거와 대화하는 곳으로 박물관의 정체성이 바뀌고 있다.",
    "유리=shisha|진열장=vitrina|우러러보는:우러러보다=ehtirom bilan qaramoq|엄숙한:엄숙하다=tantanali, jiddiy|복제품=nusxa buyum|만져:만지다=ushlab ko'rmoq|체험형=tajribaga asoslangan|대세=asosiy oqim|실감=haqiqiydek his|건축물=inshoot, bino|볼거리=tomosha qilgulik narsa|본연=asl, tub|묻힌다는:묻히다=ko'milib qolmoq|문턱=ostona|낮춘:낮추다=pasaytirmoq|과거=o'tmish|박제하는:박제하다=qotirib qo'ymoq (chuchela qilmoq)",
    ["박물관은 과거와 소통하는 공간으로 바뀌고 있다.", "박물관은 유물을 조용히 바라보기만 하는 곳이어야 한다.", "체험형 전시 때문에 젊은 관람객이 줄었다.", "박물관에서는 유물을 절대 만질 수 없다."],
    ["체험형 전시가 유물의 본래 의미를 가린다는 걱정도 있다.", "실감 영상은 지금 있는 건물만 보여 준다.", "젊은 세대는 여전히 박물관을 찾지 않는다.", "박물관의 문턱은 예전보다 높아졌다."]],
  ["hc2", "Klassik musiqa inqirozi", "클래식 공연의 문턱", "객석을 채운 청중의 머리가 희끗희끗해지면서 클래식 음악계에 위기감이 감돈다. 연주 도중 박수를 치면 눈총을 받는 등 까다로운 관람 예절이 초심자를 주눅 들게 한다는 진단이 나온다. 이에 해설을 곁들이거나 연주 시간을 한 시간 안팎으로 줄인 공연, 맥주를 마시며 듣는 음악회가 등장했다. 격을 떨어뜨린다는 볼멘소리도 있으나 초연 당시의 연주회는 지금보다 훨씬 떠들썩했다는 기록이 전한다. 전통이라 믿는 것의 상당 부분이 실은 근래에 굳어진 관습일 수 있다.",

    ["오래된 전통처럼 보이는 관람 예절도 비교적 최근에 만들어진 것일 수 있다.", "클래식 공연의 예절은 처음부터 지금과 같았다.", "새로운 형식의 공연은 모두 금지해야 한다.", "클래식 공연에는 젊은 청중이 대부분이다."],
    ["까다로운 예절 때문에 처음 온 사람이 위축된다는 분석이 있다.", "해설이 있는 공연은 사라지고 있다.", "초연 당시의 연주회는 지금보다 조용했다.", "클래식 음악계는 위기를 느끼지 않는다."]],
  ["hc3", "Shevaning qadri", "사투리의 가치", "표준어 중심의 교육과 방송은 사투리를 촌스럽고 교정해야 할 말로 취급해 왔다. 그 결과 지역 말을 구사하는 세대가 급감하고 일부 방언은 소멸의 문턱에 서 있다. 할머니의 구수한 입말을 손주가 알아듣지 못해 대화가 겉도는 풍경은 더 이상 낯설지 않다. 그러나 사투리에는 그 지방의 기후와 생업, 사람들의 기질이 녹아 있어 표준어로는 대체할 수 없는 어휘가 수두룩하다. 언어의 다양성이 줄어든다는 것은 세상을 바라보는 창이 하나씩 닫힌다는 뜻이다. 방언을 채록해 사전으로 엮고 지역 방송에서 적극 활용하는 노력이 이어져야 한다.",
    "구사하는:구사하다=erkin qo'llamoq (tilni)|급감하고:급감하다=keskin kamaymoq|구수한:구수하다=shirali, yoqimli (gap, ta'm)|입말=og'zaki so'z|손주=nevara|알아듣지:알아듣다=eshitib tushunmoq|겉도는:겉돌다=qovushmay qolmoq|생업=tirikchilik kasbi|수두룩하다=to'lib-toshgan|세상=dunyo, olam|바라보는:바라보다=qaramoq, nazar solmoq|창=deraza|하나씩=bittadan|채록해:채록하다=yozib olib to'plamoq|적극=faol tarzda",
    ["사투리는 지역의 삶이 담긴 말이므로 지키려는 노력이 필요하다.", "사투리는 고쳐야 할 잘못된 말이다.", "사투리는 표준어로 모두 바꿀 수 있다.", "사투리를 쓰는 사람은 늘고 있다."],
    ["일부 방언은 사라질 위기에 놓여 있다.", "방송은 사투리를 적극적으로 써 왔다.", "언어가 줄어도 세상을 보는 방식은 그대로이다.", "손주들은 할머니의 사투리를 모두 알아듣는다."]],
  ["hc4", "O'yin — eng jiddiy o'qish", "놀이와 배움", "아이에게 놀이는 시간 낭비가 아니라 가장 치열한 공부이다. 소꿉놀이를 하며 역할을 나누는 동안 아이는 타인의 입장을 헤아리는 법을 익히고, 규칙을 두고 옥신각신하면서 협상과 양보를 배운다. 블록을 쌓다 무너뜨리기를 거듭하는 과정에서는 가설을 세우고 검증하는 생각의 싹이 튼다. 어른이 정해 준 활동으로 일과를 빈틈없이 채우면 스스로 궁리할 겨를이 사라진다. 심심함을 견디는 시간이야말로 창의성이 움트는 토양이다.",
    "놀이=o'yin|낭비=isrof|소꿉놀이=uy-uy o'yini|옥신각신하면서:옥신각신하다=tortishmoq, g'ijillashmoq|블록=kubik|무너뜨리기를:무너뜨리다=buzib yiqitmoq|싹=nish, kurtak|튼다:트다=unib chiqmoq|활동=faoliyat, mashg'ulot|일과=kun tartibi|빈틈없이=bo'sh joy qoldirmay|궁리할:궁리하다=bosh qotirib o'ylamoq|겨를=fursat, bo'sh vaqt|심심함=zerikish|창의성=ijodkorlik|움트는:움트다=kurtak yozmoq",
    ["아이에게는 스스로 놀고 생각할 자유로운 시간이 필요하다.", "놀이는 공부에 방해가 된다.", "아이의 하루는 어른이 모두 정해 주어야 한다.", "심심한 시간은 아이에게 해롭다."],
    ["아이들은 놀이에서 규칙을 두고 다투며 양보를 배운다.", "블록 놀이는 생각하는 힘과 관계가 없다.", "소꿉놀이는 혼자 하는 놀이이다.", "일과를 가득 채울수록 창의성이 자란다."]],
  ["hc5", "Imtihon darsni boshqaradi", "시험과 수업", "시험은 무엇을 배웠는지 확인하는 도구이지만 종종 무엇을 가르칠지를 좌우하는 주인 노릇을 한다. 선다형 문항으로 줄을 세우는 평가 아래에서는 정답을 빨리 골라내는 요령이 사고력보다 우대받는다. 학생들은 시험에 나오지 않는 내용을 과감히 건너뛰고 교사는 진도를 빼기에 급급하다. 서술형 평가와 과정 중심 평가가 대안으로 제시되지만 채점의 공정성 시비가 발목을 잡는다. 평가를 바꾸지 않고 수업만 바꾸라는 요구는 공허한 구호에 그치기 쉽다.",
    "노릇=rol, vazifa|선다형=ko'p tanlovli (test)|문항=savol bandi|줄을 세우는:줄을 세우다=saflamoq, reytingga tizmoq|정답=to'g'ri javob|골라내는:골라내다=tanlab olmoq|요령=uquv, ishning hiylasi|사고력=fikrlash qobiliyati|우대받는다:우대받다=afzal ko'rilmoq|과감히=dadillik bilan|교사=o'qituvchi|진도=dasturni o'tish sur'ati|급급하다=shoshib ovora bo'lmoq|서술형=yozma bayon shakli|시비=haq-nohaqlik bahsi|발목을 잡는다:발목을 잡다=oyoqdan chalmoq, to'sqinlik qilmoq|공허한:공허하다=quruq, ma'nosiz",
    ["수업을 바꾸려면 평가 방식부터 바꿔야 한다.", "선다형 시험은 사고력을 가장 잘 길러 준다.", "서술형 평가에는 아무 문제가 없다.", "시험은 수업 내용에 영향을 주지 않는다."],
    ["서술형 평가는 채점이 공정한지에 대한 논란이 있다.", "학생들은 시험에 나오지 않는 내용도 열심히 공부한다.", "교사들은 진도에 신경 쓰지 않는다.", "현재의 평가는 사고력을 요령보다 높이 평가한다."]],
  ["hc6", "Paysalga solish odati", "미루는 습관", "할 일을 미루는 습관은 게으름보다는 감정 조절의 실패에 가깝다. 과제가 불러일으키는 불안이나 지루함을 당장 모면하려고 손쉬운 즐거움으로 도피하는 것이다. 마감이 코앞에 닥쳐서야 허둥지둥 매달리면 결과물이 부실해지고 자책이 뒤따라 다음번에는 더 미루게 된다. 과제를 잘게 쪼개 첫 단추만 끼우기로 마음먹으면 시작의 문턱이 낮아진다. 미루는 자신을 몰아세우기보다 무엇이 불편해서 피하는지 들여다보는 편이 효과적이다.",
    "조절=tartibga solish, boshqarish|불러일으키는:불러일으키다=uyg'otmoq (his)|지루함=zerikish|모면하려고:모면하다=qutulib qolmoq|손쉬운:손쉽다=oson|즐거움=zavq|도피하는:도피하다=qochib yashirinmoq|코앞=burun tagi, juda yaqin|허둥지둥=shoshib-pishib|부실해지고:부실하다=puxta emas, sifatsiz|다음번=keyingi safar|첫 단추=birinchi tugma (boshlanish)|몰아세우기보다:몰아세우다=qattiq siquvga olmoq|들여다보는:들여다보다=ichiga nazar solmoq|편=tomon; usul",
    ["미루는 버릇을 고치려면 자신을 탓하기보다 불편한 감정을 살펴야 한다.", "미루는 것은 단순히 게으르기 때문이다.", "마감 직전에 하면 결과가 가장 좋다.", "자신을 심하게 꾸짖을수록 덜 미루게 된다."],

  ["hc7", "Tarjimon va mashina", "기계 번역과 번역가", "기계 번역의 품질이 비약적으로 향상되면서 통역사와 번역가의 일자리가 사라질 것이라는 예측이 무성하다. 실제로 설명서나 계약서 초안처럼 정형화된 문서는 기계가 눈 깜짝할 사이에 처리한다. 그러나 농담에 담긴 속뜻이나 협상장의 미묘한 기류를 읽어 내는 일은 여전히 사람의 몫이다. 번역가의 역할은 처음부터 옮기는 일에서 기계가 내놓은 초벌을 검토하고 다듬는 일로 옮겨 가고 있다. 도구가 바뀔 뿐 언어 사이에 다리를 놓는 일의 본질은 달라지지 않는다.",

    ["기계 번역이 발달해도 사람 번역가의 역할은 형태를 바꾸어 계속된다.", "번역가라는 직업은 곧 완전히 사라질 것이다.", "기계는 농담의 속뜻도 완벽하게 옮긴다.", "기계 번역의 품질은 나아지지 않았다."],

  ["hc8", "Hazilning ikki tig'i", "유머의 기능", "웃음은 긴장을 풀어 주는 사회적 윤활유이다. 팽팽하던 회의 분위기가 농담 한마디에 누그러지는 것을 누구나 겪어 보았을 것이다. 함께 웃은 사람들 사이에는 한편이라는 유대가 싹튼다. 그러나 유머는 양날의 검이어서 약자를 조롱하는 농담은 웃는 이와 웃음거리가 된 이 사이에 깊은 골을 판다. 누구를 향해 웃는가를 보면 그 집단의 위계와 편견이 드러난다. 좋은 유머는 남을 깎아내리지 않고 자신을 낮추거나 부조리를 비튼다.",

    ["좋은 유머는 남을 깎아내리지 않는다.", "유머는 언제나 사람들을 가깝게 만든다.", "약자를 놀리는 농담이 가장 좋은 유머이다.", "웃음은 회의 분위기를 더 긴장시킨다."],

  ["hc9", "Mahalla kitob do'koni", "동네 책방", "대형 서점과 온라인 서점의 공세에 밀려 문을 닫던 동네 책방이 색다른 모습으로 되살아나고 있다. 주인의 취향대로 고른 책을 소량만 들여놓고 손글씨 추천사를 붙여 두는 식이다. 저자를 초청한 낭독회나 글쓰기 강좌를 열어 이웃이 모이는 사랑방 구실도 한다. 책값 할인 경쟁에서는 승산이 없으므로 책과 사람을 이어 주는 경험을 파는 셈이다. 다만 임대료와 낮은 수익 구조 탓에 몇 해를 버티지 못하는 곳이 태반이어서 지속 가능한 운영 모델이 절실하다.",

    ["동네 책방은 낭독회와 강좌를 열어 이웃이 모이는 곳이 되기도 한다.", "동네 책방은 대형 서점보다 책이 더 많다.", "동네 책방은 주인의 취향과 관계없이 책을 고른다.", "대부분의 동네 책방은 오래 유지된다."]],
  ["hc10", "Haqiqiy uzr", "사과의 조건", "잘못을 저지른 뒤 '불쾌했다면 유감'이라고 말하는 것은 사과가 아니다. 책임을 상대의 감정 탓으로 슬그머니 떠넘기기 때문이다. 제대로 된 사과에는 무엇을 잘못했는지에 대한 구체적 시인, 변명 없는 책임 인정, 재발을 막겠다는 다짐이 빠짐없이 담겨야 한다. 피해를 되돌릴 방도가 있다면 배상이 뒤따라야 진정성이 전달된다. 용서는 사과한 사람이 요구할 수 있는 권리가 아니라 받은 사람이 베푸는 선택임을 잊어서는 안 된다.",

  ["hc11", "Taqqoslash va baxt", "비교와 행복", "남의 일상을 손쉽게 엿볼 수 있게 되면서 비교는 숙명처럼 따라붙는다. 화면 속 타인은 가장 빛나는 순간만을 편집해 올리지만 우리는 그것을 자신의 무대 뒤 모습과 견준다. 애초에 공정할 수 없는 저울인 셈이다. 비교가 잦을수록 자존감이 깎이고 삶의 만족도가 떨어진다는 조사가 줄을 잇는다. 사용 시간을 줄이는 것 못지않게, 올라온 장면이 연출된 단면임을 상기하는 습관이 마음을 지키는 방패가 된다.",
    "엿볼:엿보다=mo'ralamoq|숙명=muqarrar taqdir|따라붙는다:따라붙다=ergashib yopishmoq|빛나는:빛나다=porlamoq|편집해:편집하다=tahrir qilmoq|애초에=boshidanoq|저울=tarozi|깎이고:깎이다=kesilmoq, kamaymoq|만족도=qoniqish darajasi|연출된:연출되다=sahnalashtirilmoq|단면=kesim, bir qirrasi|상기하는:상기하다=yodga olmoq|방패=qalqon",
    ["화면 속 모습은 꾸며진 일부라는 점을 기억해야 마음을 지킬 수 있다.", "다른 사람과 비교할수록 행복해진다.", "화면 속 타인의 모습은 그 사람의 전부이다.", "비교는 자존감과 관계가 없다."],

  ["hc12", "Ustalar va shogirdlar", "장인의 기술", "한 가지 기술을 수십 년 갈고닦은 장인의 손끝에서는 기계가 흉내 내기 힘든 정교함이 나온다. 대량 생산된 물건이 넘쳐 나는 시대에 이들의 작품은 오히려 희소성을 인정받아 제값을 받는다. 그러나 수련 기간이 길고 수입이 변변치 않아 뒤를 이을 제자를 구하지 못하는 작업장이 수두룩하다. 기능을 전수받을 사람이 끊기면 수백 년 이어 온 솜씨도 한 세대 만에 대가 끊긴다. 전통 기술을 박물관의 유물이 아닌 살아 있는 생업으로 만드는 지원책이 긴요하다.",

    ["전통 기술이 생업으로 이어지도록 지원해야 한다.", "장인의 기술은 기계가 쉽게 흉내 낼 수 있다.", "장인의 작품은 값을 제대로 받지 못한다.", "전통 기술은 박물관에만 보관하면 된다."],
    ["배우려는 사람이 없어 기술이 끊길 위험이 있다.", "장인이 되는 데에는 짧은 기간이면 충분하다.", "제자를 구하지 못하는 작업장은 거의 없다.", "대량 생산 시대에 장인의 작품은 흔해졌다."]],
  ["hc13", "Sportda adolat chegarasi", "스포츠와 공정", "스포츠가 감동을 주는 것은 같은 규칙 아래에서 기량을 겨룬다는 믿음 때문이다. 금지 약물은 이 믿음을 무너뜨린다. 적발 기술이 정교해질수록 이를 빠져나가려는 수법도 교묘해져 쫓고 쫓기는 싸움이 이어진다. 한편 고가의 장비나 고지대 훈련처럼 허용된 수단도 자금력에 따라 격차를 벌린다는 점에서 공정의 경계는 생각만큼 선명하지 않다. 무엇을 실력으로 인정하고 무엇을 반칙으로 볼 것인지는 결국 사회가 합의해 긋는 선이다.",

    ["비싼 장비처럼 허용된 수단도 돈에 따라 차이를 만든다.", "약물을 숨기는 방법은 점점 단순해지고 있다.", "스포츠의 감동은 규칙과 관계가 없다.", "공정의 경계는 매우 분명하다."]],
  ["hc14", "Hayotning so'nggi bosqichi", "삶의 마무리", "의학의 발달은 수명을 늘렸지만 삶의 마지막 시기를 병상에서 기계에 의지한 채 보내는 사람도 늘렸다. 회생 가능성이 없는 환자에게 인공호흡기를 달고 고통스러운 처치를 거듭하는 것이 과연 환자를 위한 일인지 의문이 제기된다. 이에 미리 자신의 뜻을 문서로 남겨 연명 치료를 받지 않겠다고 밝혀 두는 제도가 마련되었다. 남은 시간을 통증 조절에 집중하며 가족 곁에서 보내도록 돕는 돌봄도 확대되고 있다. 얼마나 오래 사느냐 못지않게 어떻게 마무리하느냐가 삶의 존엄을 좌우한다.",

  ["ea8", "Oilaviy biznes vorisi", "가업 승계", "수십 년 된 노포가 후계자를 찾지 못해 간판을 내리는 일이 잦다. 자식들은 고된 장사를 물려받기보다 번듯한 직장을 선호하고, 부모 역시 같은 고생을 대물림하고 싶어 하지 않는다. 무거운 상속 세금도 승계를 가로막는 걸림돌로 지목된다. 이에 혈연이 아닌 직원이나 외부의 젊은 창업자에게 가게와 비법을 넘겨주는 사례가 주목받고 있다. 단골의 기억이 서린 가게가 이어지려면 승계를 가족의 일로만 보는 통념에서 벗어나야 한다.",

  ["ea9", "Ko'ngilochar xarid", "보복 소비와 절약", "억눌렸던 소비 욕구가 한꺼번에 분출하는 현상을 흔히 보복 소비라 부른다. 긴 격리 끝에 사람들은 여행과 외식, 사치품에 지갑을 활짝 열었다. 그러나 금리가 오르고 대출 이자가 불어나자 분위기는 급반전했다. 이제는 하루 지출을 영으로 묶는 '무지출 챌린지'를 인증하고 냉장고 속 자투리 재료로 끼니를 때우는 요령을 나눈다. 소비 풍조가 양극단을 오가는 모습은 가계의 살림살이가 그만큼 외부 변수에 출렁인다는 방증이다.",

  ["ea10", "Qishloq turizmi", "농촌 관광", "소멸 위기의 농촌 마을이 체험 관광으로 활로를 모색하고 있다. 도시 가족이 찾아와 모내기를 거들고 갓 딴 채소로 밥을 지어 먹으며 하룻밤을 묵는 식이다. 주민들은 민박과 농산물 직거래로 쏠쏠한 부수입을 올리고 아이들은 흙을 밟아 보는 드문 경험을 한다. 다만 방문객이 반짝 몰렸다 썰물처럼 빠지면 시설 투자비만 빚으로 남는 낭패를 보기도 한다. 한철 행사가 아니라 사시사철 찾을 만한 이야기와 먹거리를 가꾸는 긴 호흡이 필요하다.",

  ["ea11", "Kutish navbati iqtisodiyoti", "줄 서기의 경제학", "소문난 맛집 앞에 길게 늘어선 줄은 그 자체로 훌륭한 광고판이다. 사람들은 남들이 기다리는 것을 보고 그만한 값어치가 있으리라 짐작하며 행렬에 합류한다. 일부 가게는 일부러 좌석을 적게 두거나 하루 판매량을 묶어 줄을 연출하기도 한다. 기다린 시간이 길수록 맛에 대한 평가가 후해지는 것은 들인 수고를 헛되지 않았다고 믿고 싶은 심리 때문이다. 줄의 길이가 반드시 맛을 보증하지는 않는다는 사실을 염두에 둘 필요가 있다.",

  ["ea12", "Ijara velosipedlari", "공유 이동 수단", "길모퉁이마다 세워진 공유 자전거와 전동 킥보드는 버스 정류장에서 집까지의 어중간한 거리를 메워 준다. 앱으로 잠금을 풀고 아무 데나 반납하면 되는 간편함이 인기 비결이다. 그러나 인도 한복판에 널브러진 기기가 보행을 방해하고 안전모 없이 내달리다 다치는 사고가 급증했다. 업체 간 출혈 경쟁으로 관리가 부실해지면서 고장 난 채 방치된 기기도 눈살을 찌푸리게 한다. 지정 구역 반납을 의무화하고 위반 시 이용자에게 과태료를 물리는 지자체가 늘고 있다.",

  ["ea13", "Ko'p ishlash madaniyati", "야근 문화", "늦게까지 자리를 지키는 것을 성실의 척도로 여기는 관행은 뿌리가 깊다. 상사가 퇴근하기 전에는 눈치가 보여 일어서지 못하고, 그렇게 늘어난 시간은 느슨한 업무 처리로 메워진다. 근무 시간이 길다고 성과가 비례해 늘지 않는다는 것은 숱한 연구가 입증한 바이다. 일부 기업은 퇴근 시각에 컴퓨터가 저절로 꺼지게 하고 회의를 삼십 분 안에 매듭짓도록 못 박았다. 얼마나 오래 앉아 있었는가가 아니라 무엇을 해냈는가로 평가의 잣대를 옮기는 것이 근본 처방이다.",

  ["sc2", "Zilzilani bashorat qilish", "지진 예측", "지진은 땅속 판들이 맞물려 버티다가 쌓인 힘이 한순간에 풀리며 일어난다. 어느 단층에 힘이 축적되고 있는지는 측량으로 어림할 수 있으나 언제 터질지를 날짜 단위로 짚어 내는 것은 현재로서는 불가능하다. 동물의 이상 행동이나 지하수 수위 변화가 전조라는 주장은 번번이 검증의 문턱을 넘지 못했다. 그래서 방재의 무게 중심은 예측에서 대비로 옮겨 갔다. 흔들림이 닿기 몇 초 전에 울리는 경보와 내진 설계가 인명을 구하는 실질적 수단이다.",
    "땅속=yer osti|판=plita|맞물려:맞물리다=bir-biriga tishlashmoq|한순간=bir lahza|단층=yer yorig'i|측량=o'lchash (yerni)|어림할:어림하다=chamalamoq|단위=birlik|짚어 내는:짚어 내다=aniq ko'rsatib bermoq|현재=hozirgi vaqt|수위=suv sathi|전조=darak, belgi|방재=ofatdan himoya|흔들림=silkinish|닿기:닿다=yetib bormoq, tegmoq|내진=zilzilaga chidamli|실질적=amaliy, haqiqiy",
    ["지진은 정확히 예측하기 어려우므로 대비에 힘써야 한다.", "지진이 일어날 날짜는 정확히 알 수 있다.", "동물의 행동으로 지진을 확실히 예측할 수 있다.", "내진 설계는 인명 피해를 줄이지 못한다."],
    ["어느 단층에 힘이 쌓이는지는 측량으로 짐작할 수 있다.", "지진 경보는 흔들림이 지나간 뒤에 울린다.", "지하수 변화가 전조라는 주장은 검증되었다.", "지진은 판들이 서로 떨어져 있을 때 일어난다."]],
  ["sc3", "Vaqt va soat", "시간의 측정", "인류는 오랫동안 해의 위치로 하루를 재고 달의 차고 기욺으로 한 달을 헤아렸다. 기계식 시계가 등장한 뒤에도 마을마다 정오가 조금씩 달라 큰 불편은 없었다. 사정이 달라진 것은 철도가 놓이면서부터이다. 역마다 시각이 제각각이어서 열차 시간표를 짜기가 곤혹스러웠고 충돌 사고의 위험도 컸다. 결국 지구를 경도에 따라 나누어 같은 구역은 같은 시각을 쓰기로 약정한 것이 오늘날의 표준시이다.",
    "재고:재다=o'lchamoq|달=oy (osmon jismi)|차고:차다=to'lmoq|기욺:기울다=og'moq, kamaymoq|기계식=mexanik|정오=tush payti (soat 12)|철도=temir yo'l|놓이면서부터:놓이다=yotqizilmoq, qo'yilmoq|제각각=har biri o'zicha|열차=poyezd|시간표=jadval (qatnov)|곤혹스러웠고:곤혹스럽다=boshi qotadigan, mushkul|경도=uzunlik (geografik)|약정한:약정하다=kelishib belgilamoq|오늘날=bugungi kun|표준시=standart vaqt",
    ["표준시는 철도 운행의 필요 때문에 만들어졌다.", "표준시는 기계식 시계가 나오기 전부터 있었다.", "마을마다 시각이 달라도 철도 운행에는 문제가 없었다.", "지구 전체가 하나의 시각을 쓴다."],
    ["역마다 시각이 달라 열차 시간표를 만들기 어려웠다.", "인류는 처음부터 기계식 시계로 시간을 쟀다.", "표준시는 위도에 따라 나눈 것이다.", "철도가 생기기 전에는 정오가 어디서나 같았다."]],
  ["sc4", "Raqamlar tarixi: nol", "영의 발견", "아무것도 없음을 나타내는 숫자 영은 뒤늦게야 수의 반열에 올랐다. 고대의 여러 문명은 빈자리를 띄어 쓰거나 점을 찍어 표시했을 뿐 그것을 하나의 수로 취급하지 않았다. 영을 다른 수와 더하고 뺄 수 있는 대등한 수로 다룬 것은 인도의 수학자들이었다. 이 개념이 아라비아 상인을 거쳐 유럽에 전파되면서 복잡한 셈이 한결 수월해졌다. 영이 없었다면 자릿값에 바탕을 둔 오늘날의 계산과 컴퓨터의 이진법은 성립할 수 없었을 것이다.",
    "숫자=raqam|반열=qator, martaba|문명=sivilizatsiya|빈자리=bo'sh o'rin|띄어:띄다=oraliq qoldirmoq|점=nuqta|찍어:찍다=bosmoq, qo'ymoq (nuqta)|더하고:더하다=qo'shmoq|뺄:빼다=ayirmoq|대등한:대등하다=teng huquqli|수학자=matematik|전파되면서:전파되다=tarqalmoq|셈=hisob|수월해졌다:수월하다=oson, yengil|자릿값=xona qiymati|바탕=asos|계산=hisob-kitob|이진법=ikkilik sanoq tizimi|성립할:성립하다=vujudga kelmoq, amalga oshmoq",
    ["영이라는 수의 개념은 오늘날의 계산과 컴퓨터의 바탕이 되었다.", "영은 인류가 가장 먼저 사용한 숫자이다.", "고대 문명은 모두 영을 수로 다루었다.", "영은 유럽에서 인도로 전해졌다."],
    ["영을 다른 수와 같은 수로 다룬 것은 인도의 수학자들이다.", "영이 전해진 뒤 계산이 더 어려워졌다.", "고대에는 빈자리를 표시하는 방법이 전혀 없었다.", "컴퓨터의 이진법은 영과 관계가 없다."]],
  ["sc5", "Mikroskop ostidagi dunyo", "현미경과 세균", "현미경이 발명되기 전까지 사람들은 질병이 나쁜 공기나 신의 노여움에서 비롯된다고 믿었다. 렌즈를 갈아 만든 조잡한 기구로 물방울 속에서 꿈틀거리는 생물을 처음 목격한 이는 포목상 출신의 아마추어였다. 그 뒤 특정 세균이 특정 질병을 일으킨다는 사실이 차례로 규명되면서 의학은 미신과 결별했다. 손 씻기와 기구 소독이라는 단순한 조치만으로 산모의 사망률이 급락한 것은 극적인 사례이다. 보이지 않던 세계를 눈앞에 끌어온 도구 하나가 인류의 수명을 바꿔 놓았다.",
    "현미경=mikroskop|발명되기:발명되다=ixtiro qilinmoq|노여움=g'azab|렌즈=linza|갈아:갈다=charxlamoq, silliqlamoq|조잡한:조잡하다=qo'pol, sifatsiz|물방울=suv tomchisi|꿈틀거리는:꿈틀거리다=g'imirlamoq|포목상=mato savdogari|출신=kelib chiqishi|차례로=navbatma-navbat|미신=xurofot|결별했다:결별하다=ajrashmoq, xayrlashmoq|소독=dezinfeksiya|산모=tuqqan ayol|사망률=o'lim darajasi|급락한:급락하다=keskin tushmoq|극적인:극적=dramatik, ta'sirli",
    ["현미경이라는 도구가 질병에 대한 이해와 인류의 수명을 바꾸었다.", "세균은 맨눈으로도 쉽게 볼 수 있다.", "현미경 이전에도 사람들은 세균이 병의 원인임을 알았다.", "손 씻기는 사망률에 영향을 주지 못했다."],
    ["처음으로 미생물을 본 사람은 전문 학자가 아니었다.", "현미경이 나온 뒤에도 의학은 미신에 의존했다.", "기구를 소독하자 산모의 사망률이 올랐다.", "사람들은 질병이 좋은 공기에서 생긴다고 믿었다."]],
  ["sc6", "Plastmassaning ixtirosi", "플라스틱의 두 얼굴", "플라스틱은 본래 코끼리 상아를 대신할 당구공 재료를 찾다가 탄생했다. 싸고 가볍고 썩지 않는 성질 덕분에 유리와 금속, 목재의 자리를 순식간에 꿰찼다. 주사기와 수혈 주머니 같은 일회용 의료 기구는 감염을 획기적으로 줄였다. 그러나 장점이던 내구성은 폐기 단계에서 고스란히 재앙이 된다. 썩지 않는다는 축복이 수백 년 동안 분해되지 않는 저주로 돌아온 셈이니, 쓰임새에 따라 수명을 설계하는 지혜가 절실하다.",
    "본래=aslida|상아=fil suyagi|당구공=bilyard shari|탄생했다:탄생하다=dunyoga kelmoq|금속=metall|목재=yog'och material|꿰찼다:꿰차다=egallab olmoq|주사기=shprits|수혈=qon quyish|획기적=inqilobiy, tub burilish yasagan|내구성=chidamlilik|재앙=ofat, balo|축복=ne'mat, duo|저주=la'nat|성질=xossa, tabiat",
    ["플라스틱은 용도에 맞게 수명을 설계해 써야 한다.", "플라스틱은 지금 당장 모두 금지해야 한다.", "플라스틱은 의료에 도움이 되지 않았다.", "플라스틱은 버린 뒤에 금방 썩는다."],
    ["플라스틱은 상아를 대신할 재료를 찾다가 만들어졌다.", "일회용 의료 기구는 감염을 늘렸다.", "플라스틱은 유리보다 무겁고 비싸다.", "플라스틱이 썩지 않는 것은 폐기할 때 장점이 된다."]],
  ["sc7", "Qadimiy DNK", "고대 유전자 분석", "수만 년 전 뼛조각에서 유전 정보를 추출하는 기술이 인류의 족보를 다시 쓰고 있다. 화석의 생김새만으로는 가릴 수 없던 집단 간의 혈연관계가 염기 서열 비교로 드러났다. 현생 인류가 멸종한 다른 인류와 피를 섞었고 그 흔적이 오늘날 우리 몸에 남아 있다는 사실도 밝혀졌다. 고지대 적응이나 특정 질병에 대한 저항력 가운데 일부는 그렇게 물려받은 유산이다. 과거의 유골이 현재의 우리가 누구인지를 일러 주는 셈이다.",
    "뼛조각=suyak parchasi|추출하는:추출하다=ajratib olmoq|족보=shajara|화석=qazilma qoldiq|생김새=tashqi ko'rinish|가릴:가리다=ajratmoq, farqlamoq|혈연관계=qon-qarindoshlik aloqasi|염기 서열=nukleotidlar ketma-ketligi|현생 인류=hozirgi zamon odami|멸종한:멸종하다=qirilib ketmoq|섞었고:섞다=aralashtirmoq|흔적=iz|밝혀졌다:밝혀지다=oydinlashmoq|적응=moslashish|저항력=qarshilik kuchi|유골=suyak qoldiqlari|일러 주는:일러 주다=aytib bermoq",
    ["오래된 뼈의 유전자가 인류의 역사와 우리 자신을 새로 알려 준다.", "화석의 모양만 보아도 혈연관계를 모두 알 수 있다.", "현생 인류는 다른 인류와 전혀 섞이지 않았다.", "고대 유전자 연구는 현재의 우리와 관계가 없다."],
    ["질병에 대한 저항력 일부는 멸종한 인류에게서 물려받았다.", "뼈에서는 유전 정보를 얻을 수 없다.", "멸종한 인류의 흔적은 우리 몸에 남아 있지 않다.", "유전자 비교로는 집단 사이의 관계를 알 수 없다."]],
  ["sc8", "Yorug'lik ifloslanishi va yulduzlar", "별이 사라진 밤", "도시의 밤하늘에서 은하수를 본 지 오래다. 위로 새어 나간 인공 조명이 대기 중의 먼지에 산란되어 하늘 전체를 희뿌옇게 물들이기 때문이다. 천문대는 점점 외딴 산꼭대기로 밀려나고 철새는 불빛에 홀려 항로를 벗어난다. 갓을 씌워 빛이 아래로만 향하게 하고 필요 이상의 밝기를 낮추는 것만으로도 상황은 크게 호전된다. 어둠 또한 보호해야 할 자연 자원이라는 인식이 싹트고 있다.",
    "밤하늘=tungi osmon|은하수=Somon yo'li|새어 나간:새어 나가다=sizib chiqmoq|조명=yoritish|먼지=chang|산란되어:산란되다=sochilmoq (nur)|희뿌옇게:희뿌옇다=oqish xira|물들이기:물들이다=bo'yamoq|천문대=rasadxona|외딴=chekka, yakka|산꼭대기=tog' cho'qqisi|밀려나고:밀려나다=surib chiqarilmoq|불빛=chiroq nuri|홀려:홀리다=aldanib maftun bo'lmoq|항로=yo'nalish (uchish, suzish)|갓=qalpoq (chiroqniki)|씌워:씌우다=kiygizmoq, qoplamoq|밝기=yorqinlik",
    ["어둠도 보호해야 할 자원이며 조명을 조절하면 상황을 개선할 수 있다.", "도시의 조명은 밝을수록 좋다.", "인공 조명은 동물에게 영향을 주지 않는다.", "도시에서도 은하수를 쉽게 볼 수 있다."],
    ["조명에 갓을 씌워 빛을 아래로만 보내면 도움이 된다.", "천문대는 도심으로 옮겨 오고 있다.", "하늘이 밝아지는 것은 먼지와 관계가 없다.", "철새는 불빛 덕분에 길을 더 잘 찾는다."]],
  ["sc9", "Ta'm sezgisi", "맛의 과학", "혀의 부위마다 느끼는 맛이 다르다는 이른바 혀 지도는 오류로 판명된 지 오래다. 단맛, 짠맛, 신맛, 쓴맛, 감칠맛을 감지하는 세포는 혀 전체에 고루 퍼져 있다. 더구나 우리가 맛이라 부르는 것의 태반은 실은 코가 맡는 향이다. 감기에 걸려 코가 막히면 음식이 밍밍하게 느껴지는 것이 그 증거이다. 식기의 무게와 색깔, 씹을 때 나는 소리까지 풍미의 인상을 좌우하니 맛은 온몸으로 빚는 종합 감각이라 할 만하다.",

    ["이름은 집안의 질서를 나타내는 것에서 개인의 선택으로 변하고 있다.", "이름을 짓는 방식은 예전과 달라지지 않았다.", "이름은 한 번 지으면 절대 바꿀 수 없다.", "요즘은 한자의 뜻을 가장 중요하게 여긴다."],
    ["이름을 바꾸는 성인이 해마다 수만 명에 이른다.", "순우리말 이름은 줄어들고 있다.", "남녀 구분이 뚜렷한 이름이 더 인기가 있다.", "개명 절차는 더 복잡해졌다."]],
  ["lc4", "Mahalla hammomi", "동네 목욕탕", "한때 골목마다 굴뚝을 세우고 있던 대중목욕탕이 빠르게 자취를 감추고 있다. 집집마다 욕실이 갖춰지고 연료비가 치솟으면서 수지를 맞추기 어려워진 탓이다. 그러나 목욕탕은 몸을 씻는 곳이기 이전에 등을 밀어 주며 근황을 묻던 동네의 응접실이었다. 문을 닫은 목욕탕을 헐지 않고 타일과 욕조를 그대로 살려 찻집이나 전시장으로 개조하는 사례가 눈길을 끈다. 쓸모를 다한 공간에 깃든 기억을 지우지 않고 이어 쓰는 것도 재생의 한 방법이다.",
    "굴뚝=mo'ri|대중목욕탕=jamoat hammomi|자취=iz|집집마다=har bir uyda|욕실=hammom xonasi|연료비=yoqilg'i xarajati|수지를 맞추기:수지를 맞추다=daromad-xarajatni tenglamoq|밀어:밀다=itarmoq; ishqalamoq|근황=so'nggi hol-ahvol|응접실=mehmonxona|헐지:헐다=buzmoq (binoni)|타일=kafel|욕조=vanna|전시장=ko'rgazma zali|개조하는:개조하다=qayta qurmoq|재생=qayta tiklanish",
    ["오래된 공간의 기억을 살려 다시 쓰는 것도 가치가 있다.", "쓸모없어진 목욕탕은 모두 헐어야 한다.", "목욕탕은 단지 몸을 씻는 곳일 뿐이었다.", "대중목욕탕은 계속 늘어나고 있다."],
    ["목욕탕을 찻집이나 전시장으로 바꾸는 사례가 있다.", "연료비가 내려서 목욕탕이 문을 닫았다.", "집에 욕실이 없는 집이 늘고 있다.", "개조할 때 타일과 욕조는 모두 없앤다."]],
  ["lc5", "Uy hayvonlari va javobgarlik", "반려동물과 책임", "반려동물을 식구로 맞는 집이 네 집 건너 한 집꼴이 되었다. 외로움을 덜어 주고 산책을 거르지 않게 해 주니 주인의 건강에도 이롭다는 연구가 많다. 그러나 귀엽다는 이유로 덜컥 들였다가 짖는 소리나 병원비를 감당하지 못해 내다 버리는 일이 휴가철마다 되풀이된다. 유기된 동물은 보호소에서 일정 기간 새 주인을 만나지 못하면 안락사에 처해진다. 입양 전 교육을 의무화하고 등록제를 내실 있게 운영해 생명을 맡는 무게를 일깨워야 한다.",
    "반려동물=uy hayvoni (hamroh)|맞는:맞다=kutib olmoq, qabul qilmoq|건너=oralatib; narigi|덜어:덜다=kamaytirmoq, yengillatmoq|이롭다는:이롭다=foydali|귀엽다는:귀엽다=yoqimtoy|덜컥=o'ylamay birdan|짖는:짖다=vovullamoq|병원비=davolanish xarajati|내다 버리는:내다 버리다=chiqarib tashlamoq|유기된:유기되다=tashlab ketilmoq|보호소=boshpana (hayvonlar uchun)|처해진다:처해지다=duchor qilinmoq|입양=asrab olish|등록제=ro'yxatga olish tizimi|내실=ichki mazmun, puxtalik",
    ["반려동물을 들이기 전에 책임의 무게를 알도록 제도를 갖춰야 한다.", "반려동물은 귀여우면 누구나 길러도 된다.", "버려진 동물은 모두 새 주인을 만난다.", "반려동물은 주인의 건강에 해롭다."],
    ["휴가철이 되면 동물을 버리는 일이 반복된다.", "반려동물을 기르는 집은 거의 없다.", "보호소의 동물은 기간에 관계없이 계속 보호받는다.", "병원비는 버리는 이유와 관계가 없다."]],
  ["lc6", "Tungi ish va uyqu", "교대 근무자의 밤", "병원과 공장, 편의점은 밤에도 멈추지 않는다. 밤낮이 뒤바뀐 교대 근무자는 생체 시계가 흐트러져 불면과 소화 장애를 달고 산다. 장기간의 야간 근무가 심장 질환과 일부 암의 위험을 끌어올린다는 보고도 누적되고 있다. 근무표를 시계 방향으로 돌리고 밤 근무 뒤에 충분한 휴식을 끼워 넣는 것만으로도 부담이 한결 덜어진다. 누군가의 밤샘 위에 사회가 굴러간다면 그 대가를 개인의 몸에만 지워서는 안 된다.",
    "밤낮=tun va kun|뒤바뀐:뒤바뀌다=o'rni almashmoq|생체 시계=biologik soat|불면=uyqusizlik|장애=buzilish; to'siq|달고 산다:달고 살다=doim birga olib yurmoq (dardni)|장기간=uzoq muddat|심장=yurak|근무표=ish jadvali|끼워 넣는:끼워 넣다=orasiga kiritmoq|덜어진다:덜어지다=yengillashmoq|굴러간다면:굴러가다=aylanib ishlamoq|지워서는:지우다=yuklamoq",
    ["밤에 일하는 사람의 건강 부담을 사회가 함께 줄여야 한다.", "야간 근무는 건강에 아무 영향을 주지 않는다.", "교대 근무자는 대부분 잠을 잘 잔다.", "근무표를 바꾸어도 부담은 줄지 않는다."],
    ["오랫동안 밤에 일하면 심장 질환의 위험이 커진다는 보고가 있다.", "병원과 공장은 밤에는 모두 문을 닫는다.", "교대 근무자의 생체 시계는 흐트러지지 않는다.", "밤 근무 뒤에는 쉬지 않는 것이 좋다."]],
  ["lc7", "Ko'cha san'ati", "거리의 예술", "허름한 담벼락에 그려진 벽화 한 점이 쇠락한 동네의 운명을 바꾸기도 한다. 낙서로 치부되던 거리 미술이 관광객을 불러 모으자 지자체들이 앞다투어 벽화 마을을 조성했다. 그러나 사진을 찍으려는 인파가 밤낮없이 골목을 메우면서 주민들은 소음과 사생활 침해에 시달리게 되었다. 견디다 못한 주민이 벽화를 페인트로 덮어 버린 곳도 있다. 삶의 터전을 구경거리로 삼을 때에는 그곳에 사는 이들의 동의와 몫이 먼저 헤아려져야 한다.",
    "허름한:허름하다=eskirgan, ko'rimsiz|담벼락=devor|그려진:그려지다=chizilmoq|벽화=devoriy rasm|운명=taqdir|낙서=devorga chizilgan yozuv|관광객=sayyoh|불러 모으자:불러 모으다=chaqirib to'plamoq|앞다투어=bir-biridan o'zishga urinib|인파=odamlar oqimi|밤낮없이=kechayu kunduz|페인트=bo'yoq|덮어:덮다=yopmoq, qoplamoq|구경거리=tomosha obyekti|동의=rozilik",
    ["동네를 관광지로 만들 때에는 주민의 동의와 이익을 먼저 살펴야 한다.", "벽화 마을은 주민에게 좋은 점만 있다.", "거리 미술은 관광객을 끌지 못한다.", "주민의 생활은 관광보다 덜 중요하다."],
    ["관광객 때문에 괴로워서 벽화를 지운 주민도 있다.", "지자체들은 벽화 마을을 만드는 데 소극적이었다.", "거리 미술은 처음부터 예술로 인정받았다.", "관광객은 낮에만 조용히 다녀갔다."]],
  ["lc8", "Yoshlar va qishloqqa qaytish", "청년 귀촌", "빽빽한 도시를 등지고 시골로 삶터를 옮기는 청년이 조금씩 늘고 있다. 치솟는 집값과 끝없는 경쟁에 지쳐 덜 벌더라도 제 속도로 살고 싶다는 바람에서다. 빈집을 고쳐 작은 책방이나 빵집을 열고, 낮에는 농사를 짓다가 밤에는 원격으로 도시의 일감을 처리하기도 한다. 그러나 텃세와 부족한 의료 시설, 또래가 없는 적막함에 못 이겨 되돌아가는 이도 적지 않다. 낭만만으로는 뿌리내릴 수 없기에 먼저 한 달쯤 살아 보는 체험 제도가 호응을 얻고 있다.",
    "삶터=yashash joyi|끝없는:끝없다=cheksiz|지쳐:지치다=holdan toymoq|벌더라도:벌다=pul topmoq|제=o'zining|바람=istak; shamol|텃세=kelgindiga yot qarash|또래=tengdosh|적막함=jimjitlik, kimsasizlik|되돌아가는:되돌아가다=ortga qaytib ketmoq|낭만=romantika|뿌리내릴:뿌리내리다=ildiz otmoq|쯤=taxminan, chamasi",
    ["시골로 옮기려면 낭만보다 미리 살아 보는 준비가 필요하다.", "시골로 간 청년은 모두 잘 정착한다.", "청년들은 돈을 더 벌려고 시골로 간다.", "시골에는 의료 시설이 충분하다."],
    ["또래가 없어 외로워서 도시로 돌아가는 청년도 있다.", "시골로 가는 청년은 줄어들고 있다.", "시골에서는 도시의 일을 전혀 할 수 없다.", "체험 제도는 호응을 얻지 못했다."]],
  ["lc9", "Kutubxonachi kasbi", "사서의 일", "사서를 책을 빌려주고 받는 사람쯤으로 여긴다면 오산이다. 무엇을 사들이고 무엇을 서가에서 물릴지 가려내는 일부터가 고도의 판단을 요한다. 이용자가 막연하게 던진 물음에서 진짜 궁금증을 캐내 알맞은 자료로 이끄는 일은 검색 엔진이 흉내 내기 어려운 기술이다. 가짜 정보가 범람하는 시대에는 출처를 따지고 걸러 읽는 법을 가르치는 교육자 노릇도 맡는다. 책의 수호자에서 지식의 길잡이로 사서의 직분이 넓어지고 있다.",
    "사서=kutubxonachi|오산=xato hisob, yanglish o'y|사들이고:사들이다=sotib olib jamlamoq|서가=kitob javoni|물릴지:물리다=olib tashlamoq, chetga surmoq|고도=yuqori daraja|물음=savol|궁금증=bilgisi kelish, qiziqish|캐내:캐내다=kovlab topmoq|이끄는:이끌다=yetaklamoq|엔진=mexanizm, dvigatel|범람하는:범람하다=toshib ketmoq|교육자=murabbiy, pedagog|수호자=qo'riqchi|길잡이=yo'l ko'rsatuvchi|직분=vazifa, burch",
    ["사서의 역할은 책을 지키는 일에서 지식을 안내하는 일로 넓어지고 있다.", "사서는 책을 빌려주는 일만 한다.", "검색 엔진이 사서의 일을 모두 대신할 수 있다.", "사서는 책을 고르는 일에 관여하지 않는다."],
    ["사서는 이용자의 질문에서 정말 알고 싶은 것을 찾아낸다.", "어떤 책을 살지는 누구나 쉽게 정할 수 있다.", "가짜 정보가 많은 시대에 사서의 역할은 줄었다.", "사서는 출처를 따지는 법을 가르치지 않는다."]],
  ["lc10", "Sovg'a berish madaniyati", "선물의 의미", "선물은 물건이 오가는 일이지만 실제로 건네지는 것은 관계에 대한 메시지이다. 지나치게 값진 선물은 받는 이에게 갚아야 한다는 채무감을 안기고, 성의 없이 고른 선물은 무심함을 들킨다. 상대의 취향과 처지를 눈여겨보았다는 흔적이 묻어날 때 선물은 값을 넘어 마음을 움직인다. 명절마다 의례적으로 돌리는 선물 꾸러미가 부담스럽다는 하소연이 느는 것은 그 흔적이 빠져 있기 때문이다. 주고받는 일이 숙제가 되었다면 방식을 덜어 낼 때가 된 것이다.",
    "오가는:오가다=borib-kelmoq|건네지는:건네지다=uzatilmoq|메시지=xabar, ishora|값진:값지다=qimmatli|갚아야:갚다=qaytarmoq (qarzni, yaxshilikni)|채무감=qarzdorlik hissi|안기고:안기다=bag'riga bermoq; his uyg'otmoq|성의=samimiy e'tibor|무심함=befarqlik|들킨다:들키다=sezilib qolmoq|의례적=rasmiyatchilik uchun|꾸러미=tugun, to'plam|부담스럽다는:부담스럽다=og'irlik qiladigan|하소연=dard-hasrat|덜어 낼:덜어 내다=kamaytirib olib tashlamoq",
    ["선물은 값보다 상대를 살핀 마음이 담겨야 의미가 있다.", "선물은 비쌀수록 좋다.", "명절 선물은 많이 돌릴수록 관계가 좋아진다.", "선물은 관계와 아무 상관이 없다."],
    ["너무 비싼 선물은 받는 사람에게 부담을 준다.", "성의 없이 고른 선물도 마음을 잘 전한다.", "명절 선물이 부담스럽다는 사람은 줄고 있다.", "선물에는 상대의 취향을 고려할 필요가 없다."]],
  ["lc11", "Marosimlarning soddalashuvi", "작은 결혼식", "수백 명의 하객 앞에서 삼십 분 만에 끝나는 예식에 회의를 품는 예비부부가 늘었다. 얼굴도 가물가물한 부모의 지인까지 불러 축의금을 주고받는 관행이 허례로 느껴진다는 것이다. 이들은 가까운 벗과 가족만 초대해 마당이나 작은 식당에서 느긋하게 식을 치른다. 비용을 줄인 만큼 신혼집 마련에 보태거나 의미 있는 곳에 기부하기도 한다. 다만 그동안 뿌린 축의금을 거두지 못하게 된 부모 세대의 서운함을 어떻게 달랠지가 넘어야 할 고개이다.",
    "하객=to'y mehmoni|예식=marosim (nikoh)|품는:품다=bag'rida saqlamoq (his)|예비부부=bo'lajak er-xotin|가물가물한:가물가물하다=xira, g'ira-shira|지인=tanish|축의금=to'yona puli|허례=quruq rasmiyatchilik|벗=do'st|마당=hovli|식=marosim|치른다:치르다=o'tkazmoq (marosim)|신혼집=yangi kelin-kuyov uyi|뿌린:뿌리다=sochmoq|거두지:거두다=yig'ib olmoq|서운함=ko'ngil og'rishi|고개=dovon; qiyin palla",
    ["작은 결혼식이 늘고 있지만 부모 세대와의 생각 차이를 풀어야 한다.", "결혼식은 하객이 많을수록 좋다.", "작은 결혼식은 비용이 더 많이 든다.", "부모 세대는 작은 결혼식을 모두 반긴다."],

  ["ec3", "Eski uyning ayvoni", "옛집의 마루", "고향 집 마루는 여름이면 온 식구의 차지였다. 할아버지는 부채를 부치며 낮잠을 청하셨고 우리는 수박을 쪼개 먹으며 씨를 마당으로 훅 불어 날렸다. 소나기가 후드득 쏟아지면 처마 끝에서 떨어지는 빗줄기를 멍하니 올려다보는 것이 그렇게 좋았다. 이제 그 집은 헐리고 반듯한 양옥이 들어섰지만 비 오는 날이면 여전히 그 마루의 서늘한 감촉이 발바닥에 되살아난다. 사라진 것들은 몸에 먼저 기억되는 모양이다.",
