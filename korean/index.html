<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>TOPIK Yo'li</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;700;900&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: one phone-width column; lessons are stations on Seoul-metro lines, each stage wears its real line colour. */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface2:#E2E7EC; --ink:#11161C; --muted:#586472; --line:#D3DAE1;
  --accent:#00843D; --accent-ink:#FFFFFF; --good:#0A8A48; --good-bg:#DDF3E6; --bad:#C92F28; --bad-bg:#FBE3E1; --warn:#B56A00;
  --ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ko:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --num:"Space Grotesk","Inter",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0C0F13; --surface:#161B22; --surface2:#222A34; --ink:#EDF1F5; --muted:#93A0AE; --line:#2B3440;
  --accent:#22C06C; --accent-ink:#04140B; --good:#35CC7E; --good-bg:#12311F; --bad:#FF6E64; --bad-bg:#3A1917; --warn:#F0A63A; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0C0F13; --surface:#161B22; --surface2:#222A34; --ink:#EDF1F5; --muted:#93A0AE; --line:#2B3440;
  --accent:#22C06C; --accent-ink:#04140B; --good:#35CC7E; --good-bg:#12311F; --bad:#FF6E64; --bad-bg:#3A1917; --warn:#F0A63A; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--ui);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{cursor:not-allowed}
.ko{font-family:var(--ko);word-break:keep-all}
.wrap{max-width:680px;margin:0 auto;padding-block:16px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
h1,h2,h3,p{margin:0} h1,h2,h3{text-wrap:balance;line-height:1.2}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13.5px}

/* header */
.top{display:flex;align-items:center;gap:12px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .sign{font-family:var(--ko);font-weight:900;font-size:20px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);flex:none}
.brand b{font-family:var(--num);font-size:19px;letter-spacing:-.01em}
.sync{font-size:12px;color:var(--muted);text-align:right}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border-radius:var(--r);padding:12px 14px;min-width:0}
.stat b{display:block;font:700 26px/1.1 var(--num);font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}

/* today plan */
.plan{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.plan h2{font:700 20px/1.2 var(--num)}
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:12px;background:var(--bg);min-width:0}
.step:disabled{opacity:.5}
.step .n{font:700 14px var(--num);width:28px;height:28px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;flex:none}
.step.done .n{background:var(--good);border-color:var(--good);color:var(--surface)}
.step .tx{flex:1;min-width:0} .step .tx b{display:block} .step .tx span{font-size:13.5px;color:var(--muted)}
.step .go{font-size:13px;font-weight:600;color:var(--accent);flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:12px 20px;border-radius:12px;font-weight:600;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface2)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn:disabled{opacity:.45}
.btn.block{width:100%}

/* metro map */
.stage{display:flex;flex-direction:column;gap:4px}
.stage-h{display:flex;align-items:center;gap:12px;padding:6px 0;width:100%;min-width:0}
.stage-h .shd{flex:1;min-width:0;display:flex;flex-direction:column}
.chev{width:28px;height:28px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font:700 16px var(--num);flex:none}
.grp{font:700 13px var(--num);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:12px;border-top:1px solid var(--line)}
.tin{width:100%;font:700 26px var(--ko);padding:14px 16px;border-radius:var(--r);border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.tin:focus{outline:3px solid var(--accent);outline-offset:1px}
.badge{width:36px;height:36px;border-radius:50%;background:var(--c,var(--accent));color:#fff;font:700 18px var(--num);display:grid;place-items:center;flex:none}
.stage-h h3{font:700 18px/1.2 var(--num)} .stage-h .cnt{font:500 13px var(--num);color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.stations{list-style:none;margin:0;padding:0;position:relative}
.stations::before{content:"";position:absolute;left:15px;top:22px;bottom:22px;width:6px;border-radius:3px;background:var(--c)}
.st{position:relative;display:flex;align-items:center;gap:14px;width:100%;padding:9px 8px 9px 0;border-radius:12px;min-width:0}
.st .dot{position:relative;z-index:1;width:36px;height:36px;display:grid;place-items:center;flex:none}
.st .dot i{display:block;width:20px;height:20px;border-radius:50%;background:var(--surface);border:4px solid var(--c)}
.st.done .dot i{background:var(--c)}
.st.now .dot i{width:28px;height:28px;box-shadow:0 0 0 4px var(--bg),0 0 0 6px var(--c)}
.st.xfer .dot i{border-radius:8px;width:24px;height:24px;border-color:var(--ink)}
.st.xfer.done .dot i{background:var(--ink)}
.st.locked{opacity:.5}
.st .code{font:500 12px var(--num);color:var(--muted);font-variant-numeric:tabular-nums}
.st .nm{flex:1;min-width:0} .st .nm b{display:block;font-weight:600} .st .nm .k{font-family:var(--ko);font-size:13.5px;color:var(--muted)}
.st .tag{font-size:12px;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--surface2);flex:none;font-variant-numeric:tabular-nums}
.st.done .tag{background:var(--good-bg);color:var(--good)}
.st.now{background:var(--surface)}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.nav div{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{padding:10px 4px 9px;text-align:center;font-size:12.5px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button .g{font:700 18px/1.2 var(--ko)}
.nav button[aria-current="page"]{color:var(--accent)}
.nav .pip{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font:600 11px/18px var(--num);margin-left:4px;vertical-align:top}

/* player */
.player{max-width:680px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pbar{display:flex;align-items:center;gap:12px;padding-block:14px}
.pbar .x{width:40px;height:40px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:18px;flex:none}
.track{flex:1;height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}
.track i{display:block;height:100%;background:var(--c,var(--accent));border-radius:5px;transition:width .25s}
.pbar .ct{font:500 13px var(--num);color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.pbody{flex:1;display:flex;flex-direction:column;gap:16px;padding-block:8px 20px}
.pfoot{position:sticky;bottom:0;background:var(--bg);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px}
.pfoot .btn{flex:1}
.pfoot .btn.ghost{flex:0 0 auto}
.slide-h{font:700 26px/1.15 var(--num)}
.slide-k{font:700 34px/1.2 var(--ko)}
.tip{background:var(--surface);border-radius:var(--r);padding:14px 16px}
.tip b{display:block;margin-bottom:2px}
.words{display:grid;gap:10px}
.word{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px;width:100%;background:var(--surface);border-radius:var(--r);padding:14px 16px;min-width:0}
.word .ko{font-weight:700;font-size:30px;line-height:1.25}
.word .tr{font:500 14px var(--num);color:var(--accent)}
.word .uz{font-size:17px;font-weight:500}
.word .note{font-size:13.5px;color:var(--muted)}
.word .l{min-width:0;display:flex;flex-direction:column;gap:1px}
.spk{width:42px;height:42px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;flex:none}
.spk svg{width:20px;height:20px;fill:currentColor}
.letters{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.letter{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:2px;align-items:flex-start;width:100%;min-width:0}
.letter .ko{font-weight:900;font-size:54px;line-height:1.1}
.letter .snd{font:700 18px var(--num);color:var(--accent)}
.letter .note{font-size:13.5px;color:var(--muted)}
.pat{font:700 28px/1.25 var(--ko)}
.eq{display:inline-block;align-self:flex-start;background:var(--good-bg);color:var(--good);font-weight:600;padding:5px 12px;border-radius:99px}
.ex{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ex button{display:grid;grid-template-columns:1fr auto;gap:0 12px;align-items:center;width:100%;background:var(--surface);border-radius:12px;padding:12px 14px;min-width:0}
.ex .ko{font-size:20px;font-weight:700} .ex .tr{font:500 13px var(--num);color:var(--accent)} .ex .uz{color:var(--muted)}
.prose{display:flex;flex-direction:column;gap:10px;max-width:62ch}
.prose ul{margin:0;padding-left:20px;display:grid;gap:4px}
.blocks{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.blk{font:900 44px/1 var(--ko);background:var(--surface);border-radius:12px;padding:14px 16px}
.blk small{display:block;font:500 12px var(--num);color:var(--muted);margin-top:6px}

/* quiz */
.qlabel{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.qbig{font-weight:900;font-size:clamp(40px,13vw,64px);line-height:1.2;text-align:center;padding:14px 0}
.qprompt{font-size:22px;font-weight:600;line-height:1.35}
.qprompt.ko{font-size:24px}
.qsub{color:var(--muted)}
.passage{background:var(--surface);border-radius:var(--r);padding:14px 16px;font-size:19px;line-height:1.7;white-space:pre-line}
.blank{display:inline-block;min-width:54px;border-bottom:3px solid var(--accent);text-align:center;color:var(--accent);font-weight:700}
.listen{align-self:center;width:96px;height:96px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.listen svg{width:40px;height:40px;fill:currentColor}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:10px 14px;font-size:17px;font-weight:500;min-width:0;overflow-wrap:anywhere}
.opt kbd{font:500 12px var(--num);color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;flex:none}
.opts.kopts .opt{font-family:var(--ko);font-size:22px;font-weight:700}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.fb{border-radius:var(--r);padding:12px 16px;font-weight:600}
.fb.ok{background:var(--good-bg);color:var(--good)} .fb.no{background:var(--bad-bg);color:var(--bad)}
.fb span{display:block;font-weight:400;color:var(--ink);margin-top:2px}
.line-a{min-height:64px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;align-content:flex-start}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{font:700 20px var(--ko);background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:8px 12px}
.tile.used{visibility:hidden}

/* result */
.res{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;padding-top:24px}
.ring{font:700 56px/1 var(--num);font-variant-numeric:tabular-nums}
.ring.pass{color:var(--good)} .ring.fail{color:var(--bad)}
.miss{list-style:none;padding:0;margin:0;display:grid;gap:8px;text-align:left;width:100%}
.miss li{background:var(--surface);border-radius:12px;padding:12px 14px}

/* flashcard + boost */
.card{background:var(--surface);border-radius:20px;padding:28px 18px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;min-height:240px;justify-content:center}
.card .ko{font-weight:900;font-size:clamp(36px,12vw,56px);line-height:1.2}
.card .uz{font-size:22px;font-weight:600}
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.hud div{background:var(--surface);border-radius:12px;padding:8px}
.hud b{display:block;font:700 24px var(--num);font-variant-numeric:tabular-nums}
.hud span{font-size:12px;color:var(--muted)}
.hero-k{font:900 44px/1.1 var(--ko)}

/* topik page */
.panel{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.panel h2{font:700 19px/1.2 var(--num)}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14.5px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.road{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.road li{display:flex;gap:12px;align-items:flex-start}
.road .badge{width:30px;height:30px;font-size:15px}
.road b{display:block}
.chip{display:inline-block;font-size:12px;font-weight:600;border-radius:99px;padding:2px 9px;background:var(--surface2);margin-left:6px;vertical-align:middle}
.chip.on{background:var(--good-bg);color:var(--good)}
.meter{height:12px;border-radius:6px;background:var(--surface2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch{width:52px;height:30px;border-radius:15px;background:var(--surface2);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);box-shadow:0 0 0 1px var(--line);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(22px)}
@media (max-width:420px){.opts.two{grid-template-columns:1fr}.stat b{font-size:22px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

</style>
<div id="main" class="wrap"></div>
<div id="player" class="player" hidden></div>
<nav class="nav" id="nav" aria-label="Bo'limlar"><div>
  <button data-act="tab" data-tab="home"><span class="g">길</span>Yo'l</button>
  <button data-act="tab" data-tab="review"><span class="g">복습</span><span>Takrorlash<span class="pip" id="pip" hidden></span></span></button>
  <button data-act="tab" data-tab="boost"><span class="g">빨리</span>Boost</button>
  <button data-act="tab" data-tab="topik"><span class="g">시험</span>TOPIK</button>
</div></nav>
<script>
(() => {
// Kurs ma'lumotlari. Har bir bosqich — Seul metrosining bitta liniyasi.
// lesson: v=[koreyscha, o'zbekcha, izoh?]  g=[{p,uz,d,ex}]  c=[gap, javob, [chalg'ituvchilar], tarjima]
// test:   qs=[{q, text?, audio?, opts, a, exp}]
const STAGES = [];

STAGES.push({
  grp: "Alifbo", id: "h", line: 5, color: "#996CAC", name: "Hangul — alifbo", ko: "한글",
  lessons: [
    {
      id: "h1", type: "hangul", t: "Asosiy unlilar", k: "모음 1",
      goal: "6 ta asosiy unlini o'qish va bo'g'in qanday tuzilishini tushunish.",
      tip: "Koreyada har kuni ko'rgan belgilaringiz endi tovushga aylanadi. Hangul — 24 ta harf, bir haftada o'rganiladi.",
      intro: "<p>Har bir koreyscha bo'g'in bitta <b>katak</b> ichiga yoziladi: <b>undosh + unli</b> (ba'zan ostida yana bir undosh).</p><p>Unli yolg'iz o'qilsa, oldiga tovushsiz <b class='ko'>ㅇ</b> qo'yiladi: <b class='ko'>ㅏ</b> → <b class='ko'>아</b>.</p><p>Tik unlilar (ㅏ ㅓ ㅣ) undoshning <b>o'ng</b> tomoniga, yotiq unlilar (ㅗ ㅜ ㅡ) <b>ostiga</b> yoziladi.</p>",
      letters: [
        ["아", "a", "Chiziqcha o'ngga qaragan"],
        ["어", "o", "«ota»dagi ochiq o. Chiziqcha chapga"],
        ["오", "o'", "«o'n»dagi o'. Chiziqcha tepaga"],
        ["우", "u", "Chiziqcha pastga"],
        ["으", "ɨ", "Ruscha «ы» kabi, lab cho'zilmaydi"],
        ["이", "i", "Tik chiziq"]
      ],
      words: [["아이", "bola"], ["오이", "bodring"], ["이", "ikki (2)"], ["오", "besh (5)"]]
    },
    {
      id: "h2", type: "hangul", t: "Asosiy undoshlar", k: "자음 1",
      goal: "9 ta asosiy undoshni o'qish va birinchi haqiqiy so'zlarni o'qish.",
      tip: "ㄱ ㄷ ㅂ ㅈ so'z boshida k, t, p, ch ga yaqinroq, so'z o'rtasida g, d, b, j bo'lib eshitiladi. Shuning uchun 부산 ham «Busan», ham «Pusan» deb yoziladi.",
      letters: [
        ["가", "ga", "ㄱ — g/k. Burchak, «g»"],
        ["나", "na", "ㄴ — n. Lotincha L ga o'xshaydi, lekin «n»"],
        ["다", "da", "ㄷ — d/t. Ochiq eshik — «d»"],
        ["라", "ra", "ㄹ — r/l. Ilon izi"],
        ["마", "ma", "ㅁ — m. Kvadrat — yopiq og'iz"],
        ["바", "ba", "ㅂ — b/p. Chelak"],
        ["사", "sa", "ㅅ — s. Ikki oyoq"],
        ["자", "ja", "ㅈ — j. ㅅ ustida tom"],
        ["하", "ha", "ㅎ — h. Shlyapali odam"]
      ],
      words: [["나", "men"], ["나라", "davlat"], ["어머니", "ona"], ["아버지", "ota"], ["바나나", "banan"], ["버스", "avtobus"], ["가수", "xonanda"], ["모자", "shlyapa"], ["다리", "oyoq; ko'prik"], ["하나", "bitta"], ["누나", "opa (o'g'il bola uchun)"], ["지하", "yer osti"]]
    },
    {
      id: "h3", type: "hangul", t: "Y-unlilar va E", k: "모음 2",
      goal: "ㅑ ㅕ ㅛ ㅠ va ㅐ ㅔ unlilarini o'qish.",
      tip: "Qoida oddiy: unliga ikkinchi chiziqcha qo'shilsa, oldiga «y» tovushi qo'shiladi: ㅏ a → ㅑ ya.",
      letters: [
        ["야", "ya", "ㅏ + chiziqcha"],
        ["여", "yo", "ㅓ + chiziqcha. «yosh»dagi yo"],
        ["요", "yo'", "ㅗ + chiziqcha. «yo'l»dagi yo'"],
        ["유", "yu", "ㅜ + chiziqcha"],
        ["애", "e", "ㅏ + ㅣ. Hozir ㅔ bilan bir xil o'qiladi"],

// ---------- o'zbekcha transkripsiya ----------
const CH = ["g", "kk", "n", "d", "tt", "r", "m", "b", "pp", "s", "ss", "", "j", "jj", "ch", "kh", "th", "ph", "h"];
const JU = ["a", "e", "ya", "ye", "o", "e", "yo", "ye", "o'", "wa", "we", "we", "yo'", "u", "wo", "we", "wi", "yu", "ɨ", "ɨy", "i"];
const JE = ["", "k", "k", "k", "n", "n", "n", "t", "l", "k", "m", "l", "l", "l", "p", "l", "m", "p", "p", "t", "t", "ng", "t", "t", "k", "t", "p", "t"];
const LINK = ["", "g", "kk", "ks", "n", "nj", "n", "d", "r", "lg", "lm", "lb", "ls", "lth", "lph", "r", "m", "b", "ps", "s", "ss", "ng", "j", "ch", "kh", "th", "ph", ""];
const syl = c => { const i = c.charCodeAt(0) - 0xAC00; return i >= 0 && i < 11172 ? [i / 588 | 0, (i % 588) / 28 | 0, i % 28] : null; };
function tr(str) {
  let out = "", carry = "", prevFinal = 0;
  for (let n = 0; n < str.length; n++) {
    const s = syl(str[n]);
    if (!s) { out += str[n]; carry = ""; prevFinal = 0; continue; }
    const nx = n + 1 < str.length ? syl(str[n + 1]) : null;
    let on = CH[s[0]];
    if (s[0] === 9 && [2, 6, 12, 17, 20].includes(s[1])) on = "sh";
    if (s[0] === 5 && prevFinal === 8) on = "l";
    if (carry) { on = s[1] === 20 && carry === "th" ? "ch" : s[1] === 20 && carry === "d" ? "j" : carry; carry = ""; }
    let fin = JE[s[2]];
    if (s[2] && nx && nx[0] === 11 && s[2] !== 21) { carry = LINK[s[2]]; fin = ""; if (carry.length > 1 && carry[0] === "l") { fin = "l"; carry = carry.slice(1); } if (carry === "ks" || carry === "ps" || carry === "nj") { fin = carry[0]; carry = carry.slice(1); } }
    else if (nx && (nx[0] === 2 || nx[0] === 6)) fin = fin === "k" ? "ng" : fin === "t" ? "n" : fin === "p" ? "m" : fin;
    if (out && syl(str[n - 1])) out += "-";
    out += on + JU[s[1]] + fin;
    prevFinal = s[2];
  }
  return out;
}

function complete(L, score, weak) {
  touchDay();
  const prev = S.done[L.id];
  S.done[L.id] = { s: Math.max(score, prev ? prev.s : 0), d: dayNum() };
  addWords(L);
  Object.keys(weak || {}).forEach(k => { if (S.srs[k]) S.srs[k] = { b: 0, d: dayNum() }; });

    return shuffle(qs);
  }
  V.forEach((w, i) => qs.push(i % 2 ? qUzKo(w, own, pool) : qKoUz(w, own, pool)));
  if (audioOK()) shuffle(V).slice(0, 3).forEach(w => qs.push(qListen(w, own, pool)));
  if (S.set.type) shuffle(V.filter(w => !/[-()\/…]/.test(w.k))).slice(0, 3).forEach(w => qs.push({ type: "type", label: "Koreyscha yozing", prompt: esc(w.uz), answer: w.k, wk: w.k }));
  (L.c || []).forEach(c => qs.push(qCloze(c)));
  const sents = []; (L.g || []).forEach(g => g.ex.forEach(e => { const n = e[0].split(" ").length; if (n >= 3 && n <= 6) sents.push(e); }));
  shuffle(sents).slice(0, 3).forEach(e => qs.push({ type: "build", label: "Gapni tuzing", prompt: esc(e[1]), answer: e[0], tokens: shuffle(e[0].split(" ")) }));
  return shuffle(qs);
}

}

// ---------- savol ko'rinishi ----------
function qBody(q, picked) {
  let h = `<div class="qlabel">${q.label}</div>`;
  if (q.text) h += `<div class="passage ko">${esc(q.text)}</div>`;
  if (q.audio) h += audioOK() ? `<button class="listen" data-act="say" data-t="${esc(q.audio)}" aria-label="Tinglash">${SPK}</button>` : `<div class="passage ko">${esc(q.audio)}</div>`;
  if (q.big) h += `<div class="qbig ko">${esc(q.big)}</div>`;
  if (q.prompt) h += `<div class="qprompt ${q.pko ? "ko" : ""}">${q.prompt}</div>`;
  if (q.sub) h += `<div class="qsub">${q.sub}</div>`;
  if (q.type === "type") return h + `<input id="typein" class="tin ko" lang="ko" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="한글로 쓰세요" value="${esc(q.typed || "")}" ${picked != null ? "disabled" : ""}>`;
  if (q.type === "build") {
    h += `<div class="line-a">${q.sel.map((ti, j) => `<button class="tile" data-act="untile" data-j="${j}" ${picked != null ? "disabled" : ""}>${esc(q.tokens[ti])}</button>`).join("")}</div><div class="tiles">${q.tokens.map((t, i) => `<button class="tile ${q.sel.includes(i) ? "used" : ""}" data-act="tile" data-i="${i}" ${picked != null ? "disabled" : ""}>${esc(t)}</button>`).join("")}</div>`;
    return h;
  }
  const two = q.opts.every(o => o.length <= 9);
  h += `<div class="opts ${two ? "two" : ""} ${q.kopts ? "kopts" : ""}">${q.opts.map((o, i) => `<button class="opt ${picked != null ? (i === q.a ? "ok" : i === picked ? "no" : "") : ""}" data-act="opt" data-i="${i}" ${picked != null ? "disabled" : ""}><kbd>${i + 1}</kbd><span>${esc(o)}</span></button>`).join("")}</div>`;
  return h;
}

function stopTimer() { if (cur && cur.timer) { clearInterval(cur.timer); cur.timer = null; } }

}

}
function startQuiz() {

  P.qs.forEach(q => { if (q.type === "build") q.sel = []; });
  render(); announce();
}
function announce() { const q = cur && cur.qs[cur.qi]; if (!q) return; if (q.audio && audioOK()) say(q.audio, true); else if (q.say) say(q.say); }
function renderPlayer() {
  const P = cur, L = P.L;
  let body = "", foot = "", frac = 0, ct = "";
  if (P.phase === "intro") {
    body = P.slides[P.si]; frac = (P.si + 1) / (P.slides.length + 1) * 0.4; ct = (P.si + 1) + " / " + P.slides.length;
    const last = P.si === P.slides.length - 1;
    foot = `<button class="btn ghost" data-act="prev" ${P.si ? "" : "disabled"}>Orqaga</button><button class="btn primary" data-act="fwd">${last ? (L.type === "test" ? "Testni boshlash" : "Mashqni boshlash") : "Davom etish"}</button>`;
    if (P.si === 0 && !last && isDone(L)) foot = `<button class="btn ghost" data-act="skip-intro">Mashqqa o'tish</button>` + foot.replace(/^<button class="btn ghost".*?<\/button>/, "");
  } else if (P.phase === "quiz") {
    const q = P.qs[P.qi]; frac = 0.4 + 0.6 * Math.min(1, P.qi / P.qs.length); ct = Math.min(P.qi + 1, P.qs.length) + " / " + P.qs.length + (L.type === "test" ? ` · <span id="tm">${fmt(P.tLeft)}</span>` : "");
    body = qBody(q, P.picked);
    if (P.picked != null) {
      const good = P.wasRight, right = rightOf(q);
      body += `<div class="fb ${good ? "ok" : "no"}" role="status">${good ? "To'g'ri!" : "To'g'ri javob: <b class='ko'>" + esc(right) + "</b>"}${q.fbKo ? `<span class="ko">${esc(q.fbKo)}${S.set.tr ? " · " + esc(tr(q.fbKo)) : ""}</span>` : ""}${q.exp ? `<span>${esc(q.exp)}</span>` : ""}${!good && L.type !== "test" ? "<span>Bu savol oxirida yana qaytadi.</span>" : ""}</div>`;
      foot = `<button class="btn primary" data-act="next">Davom etish</button>`;
    } else if (q.type === "build") foot = `<button class="btn primary" data-act="check" ${q.sel.length === q.tokens.length ? "" : "disabled"}>Tekshirish</button>`;
    else if (q.type === "type") foot = `<button class="btn primary" data-act="check-type">Tekshirish</button>`;
  } else {
    const sc = P.total ? P.ok / P.total : 0, pass = sc >= PASS, nx = ALL[L.idx + 1];
    frac = 1;
    body = `<div class="res"><div class="ring ${pass ? "pass" : "fail"}">${Math.round(sc * 100)}%</div><h2 class="slide-h">${pass ? (nx ? "Keyingi bekat ochildi" : "Birinchi bosqich tugadi!") : "Yana bir urinish kerak"}</h2><p class="muted">${P.ok} / ${P.total} birinchi urinishda to'g'ri. O'tish bali: ${PASS * 100}%.</p>${pass ? `<p>${vocabOf(L).length ? vocabOf(L).length + " ta so'z takrorlash jadvaliga qo'shildi — ertaga birinchi marta qaytadi." : ""}${Object.keys(P.weak).length ? " Xato qilingan " + Object.keys(P.weak).length + " ta so'z bugungi takrorlashga tushdi." : ""}${L.type === "test" ? " Oldingi barcha bekatlar o'tilgan deb belgilandi." : ""}</p>` : `<p>Xato qilgan joylaringizni ko'rib chiqing va mashqni qayta ishlang. Shoshilmang — poydevor mustahkam bo'lsa, keyingi bekatlar tez o'tadi.</p>`}${P.miss.length ? `<ul class="miss">${P.miss.map(m => `<li><b class="ko">${esc(m.a)}</b>${m.p ? `<div class="small muted">${m.p}</div>` : ""}${m.exp ? `<div class="small">${esc(m.exp)}</div>` : ""}</li>`).join("")}</ul>` : ""}</div>`;
    foot = pass ? (nx ? `<button class="btn ghost" data-act="close">Xarita</button><button class="btn primary" data-act="open" data-i="${nx.idx}">Keyingi: ${esc(nx.t)}</button>` : `<button class="btn primary" data-act="close">Yo'lga qaytish</button>`) : `<button class="btn ghost" data-act="again-intro">Darsni qayta ko'rish</button><button class="btn primary" data-act="again">Qayta urinish</button>`;
  }
  player.style.setProperty("--c", L.stage.color);
  player.innerHTML = `<div class="pbar"><button class="x" data-act="close" aria-label="Yopish">✕</button><div class="track"><i style="width:${Math.round(frac * 100)}%"></i></div><span class="ct">${ct}</span></div><div class="pbody">${body}</div><div class="pfoot">${foot}</div>`;
  const ti = $("#typein"); if (ti && !ti.disabled) ti.focus();
}
function answer(right) {
  const P = cur, q = P.qs[P.qi];
  P.wasRight = right;
  if (right && !q.retry) P.ok++;
  if (!right) {
    if (q.wk) P.weak[q.wk] = 1;
    if (!q.retry) P.miss.push({ a: rightOf(q), p: q.big ? esc(q.big) : q.text ? esc(q.text) : q.audio ? esc(q.audio) : q.prompt || "", exp: q.exp });
    if (P.L.type !== "test") { const c = Object.assign({}, q, { retry: 1 }); if (c.type === "build") { c.sel = []; c.tokens = shuffle(c.tokens); } else if (c.type === "type") c.typed = ""; else { const r = c.opts[c.a]; c.opts = shuffle(c.opts); c.a = c.opts.indexOf(r); } P.qs.push(c); }
  }
  if (q.answer) say(q.answer); else if (q.after) say(q.after); else if (q.fbKo && !right) say(q.fbKo);
  render();
}
function nextQ() {
  const P = cur; P.picked = null; P.qi++;
  if (P.qi >= P.qs.length) { finish(); return; }
  render(); announce(); window.scrollTo(0, 0);
}

// ---------- boost mantiqi ----------
function boostStart() {
  if (learned() < 4) return;
  if (B && B.timer) clearInterval(B.timer);
  B = { t: 60, score: 0, combo: 0, maxc: 0, n: 0, ok: 0, miss: [], q: boostQ(), picked: null, over: false };
  B.timer = setInterval(() => {
    if (!B || B.over) return;
    B.t--; const el = $("#bt"); if (el) el.textContent = B.t;
    if (B.t <= 0) boostOver();
  }, 1000);
  nav.hidden = true; render(); nav.hidden = true;
}
function boostOver() {
  clearInterval(B.timer); B.over = true;
  touchDay(); S.day.boost = 1; if (B.score > S.best) S.best = B.score;
  const t = dayNum(); B.miss.forEach(k => { if (S.srs[k]) S.srs[k] = { b: 0, d: t }; });
  save(); render();
}
function boostPick(i) {
  const q = B.q; if (B.picked != null || B.over) return;
  B.picked = i; B.n++;
  const key = q.big || q.after;
  if (i === q.a) { B.ok++; B.combo++; B.maxc = Math.max(B.maxc, B.combo); B.score += 10 * Math.min(5, 1 + ((B.combo - 1) / 3 | 0)); }
  else { B.combo = 0; if (!B.miss.includes(key)) B.miss.push(key); }
  render(); nav.hidden = true;
  setTimeout(() => { if (!B || B.over) return; B.q = boostQ(); B.picked = null; render(); nav.hidden = true; }, i === q.a ? 250 : 900);
}

// ---------- hodisalar ----------
const ACT = {
  tab(el) { if (B && !B.over) return; tab = el.dataset.tab; R = null; if (B) B = null; resetArm = false; render(); window.scrollTo(0, 0); },
  open(el) { openLesson(+el.dataset.i); },
  say(el) { say(el.dataset.t, true); },
  close() { stopTimer(); cur = null; tab = "home"; render(); },
  prev() { if (cur.si) { cur.si--; render(); window.scrollTo(0, 0); } },
  fwd() { if (cur.si < cur.slides.length - 1) { cur.si++; render(); window.scrollTo(0, 0); } else startQuiz(); },
  "skip-intro"() { startQuiz(); },
  opt(el) {
    const i = +el.dataset.i;
    if (!cur) { if (B) boostPick(i); else if (R && !R.q.length && R.g.length && R.gp == null) { const q = R.g[0]; R.gp = i; R.gn++; if (i === q.a) R.gok++; say(q.after); render(); } return; }
    if (cur.picked != null) return;
    cur.picked = i; answer(i === cur.qs[cur.qi].a);
  },
  tile(el) { const q = cur.qs[cur.qi]; q.sel.push(+el.dataset.i); say(q.tokens[+el.dataset.i]); render(); },
  untile(el) { cur.qs[cur.qi].sel.splice(+el.dataset.j, 1); render(); },
  check() { const q = cur.qs[cur.qi]; cur.picked = -1; answer(q.sel.map(i => q.tokens[i]).join(" ") === q.answer); },
  next() { nextQ(); },
  again() { startQuiz(); window.scrollTo(0, 0); },
  "again-intro"() { openLesson(cur.L.idx); },
  "rev-start"() { R = { q: shuffle(dueCards()).slice(0, 30), g: shuffle(grammarPool()).slice(0, 6).map(qCloze), gp: null, gn: 0, gok: 0, n: 0, ok: 0, open: false }; render(); if (R.q[0]) say(R.q[0]); },
  "rev-gnext"() { R.g.shift(); R.gp = null; if (!R.g.length) { touchDay(); S.day.rev = 1; save(); } render(); window.scrollTo(0, 0); },
  stage(el) { const id = el.dataset.id, ni = nextIdx(), o = openSt[id] != null ? openSt[id] : ni < 0 || ALL[ni].stage.id === id; openSt[id] = !o; render(); },
  "check-type"() { const q = cur.qs[cur.qi], el = $("#typein"); q.typed = el ? el.value : ""; cur.picked = -1; answer(nz(q.typed) === nz(q.answer)); },
  "rev-show"() { R.open = true; render(); },
  "rev-yes"() { revMark(true); },
  "rev-no"() { revMark(false); },
  "rev-end"() { R = null; tab = "home"; render(); },
  "boost-start"() { boostStart(); },
  "boost-stop"() { boostOver(); },
  "boost-end"() { B = null; tab = "home"; render(); },
  set(el) { const k = el.dataset.k; S.set[k] = !S.set[k]; save(); render(); },
  reset() { if (!resetArm) { resetArm = true; render(); return; } resetArm = false; const set = S.set; S = fresh(); S.set = set; save(); tab = "home"; render(); }
};
function revMark(ok) {
  const k = R.q.shift(), c = S.srs[k], t = dayNum();
  if (!R.seen) R.seen = {};
  if (!R.seen[k]) { R.seen[k] = 1; R.n++; if (ok) R.ok++; }
  if (ok) { if (c.d <= t) { c.b = Math.min(c.b + 1, GAPS.length - 1); c.d = t + GAPS[c.b]; } }
  else { c.b = 0; c.d = t + 1; R.q.push(k); }
  R.open = false;
  if (!R.q.length && !R.g.length) { touchDay(); S.day.rev = 1; }
  save(); render();
  if (R.q[0]) say(R.q[0]);
}
document.addEventListener("click", e => { const el = e.target.closest("[data-act]"); if (!el || el.disabled) return; const f = ACT[el.dataset.act]; if (f) f(el); });
document.addEventListener("keydown", e => {
  if (e.target.id === "typein") { if (e.key === "Enter" && !e.isComposing) { const b = $('[data-act="check-type"]'); if (b) b.click(); } return; }
  if (e.target.closest("input,textarea")) return;
  if (e.key >= "1" && e.key <= "4") { const b = document.querySelectorAll(".opt")[+e.key - 1]; if (b && !b.disabled) b.click(); }
  else if (e.key === "Enter" && cur) { const b = $(".pfoot .btn.primary"); if (b && !b.disabled && document.activeElement.tagName !== "BUTTON") b.click(); }
});
render();

})();
</script>
